# Rebuilds data/areas.json and data/members.json (the lists the website reads) from the one-file-per-item
# folders data/areas/ and data/members/ whenever one is added, edited or deleted in Pages CMS.
name: Build areas and members lists
on:
  push:
    branches: [main]
    paths: ['data/areas/**', 'data/members/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data/areas.json and data/members.json
        run: |
          python3 - <<'PY'
          import glob, json, os
          for folder, key in (('areas', 'areas'), ('members', 'members')):
              items = []
              for f in sorted(glob.glob('data/%s/*.json' % folder)):
                  a = json.load(open(f, encoding='utf-8'))
                  a['id'] = os.path.basename(f)[:-5]
                  items.append(a)
              with open('data/%s.json' % folder, 'w', encoding='utf-8') as out:
                  json.dump({key: items}, out, indent=2, ensure_ascii=False)
                  out.write('\n')
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/areas.json data/members.json
          git diff --cached --quiet || (git commit -m "Rebuild areas and members lists" && git push)
