# Rebuilds data/areas.json (the list the website reads) from the one-file-per-area folder data/areas/
# whenever an area is added, edited or deleted in Pages CMS.
name: Build areas list
on:
  push:
    branches: [main]
    paths: ['data/areas/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build data/areas.json
        run: |
          python3 - <<'PY'
          import glob, json, os
          areas = []
          for f in sorted(glob.glob('data/areas/*.json')):
              a = json.load(open(f, encoding='utf-8'))
              a['id'] = os.path.basename(f)[:-5]
              areas.append(a)
          with open('data/areas.json', 'w', encoding='utf-8') as out:
              json.dump({'areas': areas}, out, indent=2, ensure_ascii=False)
              out.write('\n')
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/areas.json
          git diff --cached --quiet || (git commit -m "Rebuild areas list" && git push)
