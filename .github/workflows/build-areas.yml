# Rebuilds data/areas.json, data/members.json and data/events.json (the lists the website reads) and the
# Area / Organiser dropdown choices in .pages.yml from the
# one-file-per-item folders data/areas/, data/members/, data/events/ and data/types/ whenever one is added, edited or deleted in Pages CMS.
name: Build areas, members and events lists
on:
  push:
    branches: [main]
    paths: ['data/areas/**', 'data/members/**', 'data/events/**', 'data/types/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild lists and form dropdowns
        run: python3 .github/build_lists.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/areas.json data/members.json data/events.json .pages.yml
          git diff --cached --quiet || (git commit -m "Rebuild areas, members and events lists" && git push)
