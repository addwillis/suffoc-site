<!DOCTYPE html>
<html lang="en-GB">
<head>
<script>
/* Clean addresses (no #): works on GitHub Pages under /suffoc-site/ and on a normal domain at /. */
(function(){
  window.BASE = /^\/suffoc-site(\/|$)/.test(location.pathname) ? '/suffoc-site/' : '/';
  document.write('<base href="' + window.BASE + '">');
  var q = location.search.match(/[?&]p=([^&]*)/);
  if (q) history.replaceState(null, '', window.BASE + decodeURIComponent(q[1]).replace(/^\/+/, '') + location.hash);
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUFFOC Website Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: flat seven-item menu, no sub-menus; Club is a hub of tiles.
     Contour-line hero, control-circle map pins. Single light theme by choice. */
  --navy:#0B2A55;
  --navy-deep:#071C3B;
  --sky:#4DA3E0;
  --tint:#E8F3FB;
  --gold:#F2B705;--course:#A3238E;
  --paper:#F5F5F5;
  --card:#FFFFFF;
  --ink:#222222;
  --muted:#5A6676;
  --line:#D7DEE7;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --radius:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.55 var(--body);-webkit-text-size-adjust:100%}
a{color:var(--navy)}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--display);color:var(--navy);margin:0;line-height:1.05;text-wrap:balance}
h2{font-size:clamp(1.55rem,5.5vw,2rem);font-weight:700;letter-spacing:.01em;text-transform:uppercase}
h3{font-size:1.4rem;font-weight:700;letter-spacing:.01em}
p{margin:0 0 1rem;max-width:65ch}

/* Header */
.site-header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--gold)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.brand svg{flex:none}
.brand .name{font:700 1.75rem/1 var(--display);letter-spacing:.05em}
.brand .logo{display:block;height:76px;width:auto;margin:6px 0}
@media (max-width:520px){.brand .logo{height:54px}}
.brand .sub{display:block;font:600 .72rem/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:#BFD3EA;margin-top:3px}
.menu-btn{background:transparent;color:#fff;border:2px solid #fff;border-radius:8px;font:600 1rem var(--body);padding:.45rem .8rem;cursor:pointer}
@media (max-width:520px){.brand .sub{display:none}}
.nav{display:none;padding-bottom:12px}
.nav.open{display:block}
.nav ul{list-style:none;margin:0;padding:0}
.nav a{display:block;color:#fff;text-decoration:none;font:600 1.05rem var(--body);padding:.7rem .25rem;border-bottom:1px solid rgba(255,255,255,.14)}
.nav a[aria-current="page"]{color:var(--gold)}
.nav a{transition:color .15s,background-color .15s}
.nav .ni{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;margin-right:.5rem;flex:none}
.nav a:not(.join):hover,.nav a:not(.join):focus-visible{background:rgba(255,255,255,.08)}
.nav .join:hover,.nav .join:focus-visible{background:#ffc933}
.nav .join{display:inline-block;margin-top:.8rem;background:var(--gold);color:var(--navy);border:0;border-radius:8px;padding:.6rem 1.1rem;font-weight:700}
@media (min-width:1180px){
  .site-header .wrap{display:flex;align-items:stretch;justify-content:space-between;gap:16px}
  .site-header .nav{display:flex;align-items:stretch}
  .site-header .nav ul{align-items:stretch}
  .site-header .nav li{display:flex}
  .site-header .brand{flex:none}
  .site-header .brand .sub{white-space:nowrap;font-size:.62rem;letter-spacing:.1em}
  .site-header .nav a{display:flex;align-items:center;padding:0 .55rem;white-space:nowrap}
  .site-header .nav .join{align-self:center;margin:0 0 0 10px;padding:.5rem 1rem}
  .site-header .nav a:not(.join){border-bottom-width:3px;margin-bottom:-3px}
}
@media (min-width:880px){
  .menu-btn{display:none}
  .nav,.nav.open{display:block;padding:0}
  .nav ul{display:flex;align-items:center;gap:2px}
  .nav a{border-bottom:3px solid transparent;padding:1.2rem .7rem 1rem;font-size:1rem}
  .nav a[aria-current="page"]{border-bottom-color:var(--gold)}
  .nav a:not(.join):hover,.nav a:not(.join):focus-visible{background:none;border-bottom-color:rgba(255,255,255,.75)}
  .nav .join{margin:0 0 0 10px;padding:.5rem 1rem;border-bottom:0}
}

/* Hero */
.hero{position:relative;background:var(--navy);color:#fff;overflow:hidden}
.hero .contours{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;padding-top:3.2rem;padding-bottom:3.6rem}
.hero h1{color:#fff;font-size:clamp(2.7rem,8vw,5rem);font-weight:700;text-transform:uppercase;letter-spacing:.01em;max-width:11ch}
.hero .lead{font-size:1.2rem;color:#DCE8F5;margin:1.1rem 0 1.6rem;max-width:52ch}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;font:700 1.02rem var(--body);text-decoration:none;padding:.75rem 1.25rem;border-radius:8px;border:2px solid transparent}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{color:#fff;border-color:rgba(255,255,255,.7)}
.btn.line{color:var(--navy);border-color:var(--navy)}
.btn:hover{filter:brightness(1.08)}
.btn.big{font-size:1.3rem;padding:1rem 2.2rem;border-radius:10px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.facts dd.code a{color:var(--navy);text-decoration:underline;text-underline-offset:3px}
.entrycard{background:var(--tint);border-color:#bcd7ec;text-align:center}
.btn .ei{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;margin-right:.5rem}
.entrycard .btn.big{display:block;width:100%;text-align:center}
.entrycard .note-line{margin:.8rem 0 0;color:var(--navy);font-weight:600}
.btn.small{font-size:.92rem;padding:.4rem .8rem;border-width:1.5px}

/* Sections */
.section{padding:2.4rem 0 .6rem}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:1.1rem}
.more{font-weight:600;white-space:nowrap}
.pagehead{padding:2.2rem 0 1.2rem;border-bottom:1px solid var(--line);background:var(--card)}
.pagehead h1{font-size:clamp(2.2rem,6vw,3.4rem);text-transform:uppercase;font-weight:700}
.tile h3 .ci,.card h3 .ci{width:1.1em;height:1.1em;fill:none;stroke:var(--course);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.15em;margin-right:.45rem}
.pagehead .hi{width:.8em;height:.8em;fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.04em;margin-right:.3em}
.pagehead .lead{margin:.7rem 0 0;color:var(--muted);font-size:1.1rem}
.back{display:inline-block;margin-bottom:.8rem;font-weight:600}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:1.2rem}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.two-col{display:grid;gap:28px;grid-template-columns:1fr}
@media (min-width:860px){.two-col{grid-template-columns:1fr 1fr}}

/* Event cards */
.events{display:grid;gap:14px}
.event{display:grid;grid-template-columns:72px 1fr;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.datebox{background:var(--navy);color:#fff;border-radius:8px;text-align:center;padding:.55rem .2rem;align-self:start;font-family:var(--display)}
.datebox .wd{display:block;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:#BFD3EA}
.datebox .day{display:block;font-size:2.2rem;font-weight:700;line-height:1}
.datebox .mon{display:block;font-size:1rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.pill{text-decoration:none;display:inline-block;font:600 .75rem/1 var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--tint);color:var(--navy);padding:.3rem .55rem;border-radius:999px;margin-bottom:.45rem}
a.pill:hover{background:var(--navy);color:#fff}
.meta{color:var(--muted);margin:.3rem 0 .7rem;font-weight:500}
.links{display:flex;flex-wrap:wrap;gap:8px}

/* Event page */
.title-link{color:inherit;text-decoration:none}
.title-link:hover{text-decoration:underline;text-decoration-thickness:2px}
.detail-grid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);padding-top:1.6rem}
@media (min-width:900px){
  .detail-grid{grid-template-columns:minmax(0,1fr) 340px}
  .detail-grid > aside{grid-column:2;grid-row:1}
}
dl.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:.8rem 0 0}
dl.facts dt{color:var(--muted);font-weight:500}
dl.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
dl.facts dd a{color:var(--navy);text-decoration:underline;text-underline-offset:3px}
dl.facts dd a:hover{color:var(--sky)}
.detail-grid > *{min-width:0}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600;font-size:.98rem}
.ctable{width:100%;border-collapse:collapse;margin-top:.8rem}
.ctable th{text-align:left;font:600 .75rem/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:0 .6rem .5rem 0}
.ctable td{padding:.6rem .6rem .6rem 0;border-top:1px solid var(--line,#e3e8ef);vertical-align:middle}
.ctable td.num{white-space:nowrap}
.cchip{display:inline-flex;align-items:center;gap:.5rem;font-weight:600}
.cchip i{width:1.05rem;height:1.05rem;border-radius:50%;flex:none;border:1px solid rgba(0,0,0,.25)}
.cnote{color:var(--muted);font-size:.9rem}
.cwrap{overflow-x:auto}
.todo{border-style:dashed;background:transparent}
.event-title{font-size:clamp(2rem,5.5vw,3rem)!important}

/* Cards */
.year{margin:0 0 1rem}
.year>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:.8rem;font:700 1.7rem var(--display);color:var(--navy);padding:.3rem 0;text-transform:uppercase;letter-spacing:.02em}
.year>summary::-webkit-details-marker{display:none}
.year>summary::before{content:"\25B8";font-size:1.1rem;transition:transform .15s}
.year[open]>summary::before{transform:rotate(90deg)}
.year>summary .count{font:500 1rem var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.rlist{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-top:.5rem;overflow:hidden}
.rrow{display:grid;grid-template-columns:72px 1fr;gap:.35rem 16px;align-items:start;padding:.85rem 1rem;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .datebox{grid-row:span 2}
.rrow .datebox{background:#E6EAF0;color:var(--navy)}
.rrow .datebox .wd{color:#5B6B7F}
.rrow .datebox .mon{color:#5B6B7F}
.rrow.up .datebox{background:var(--navy);color:#fff}
.rrow.up .datebox .wd{color:#BFD3EA}
.rrow.up .datebox .mon{color:var(--gold)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.rrow h3{font-size:1.1rem;margin:0}
.rrow .links{grid-column:2;margin-top:.35rem}
.rrow .tbc{grid-column:2;margin:.1rem 0 0;color:var(--muted)}
@media(min-width:760px){.rrow .datebox{grid-row:auto}.rrow{grid-template-columns:72px minmax(0,1fr) minmax(0,1.6fr);align-items:center}.rrow .links,.rrow .tbc{grid-column:3;margin:0;justify-content:flex-end;text-align:right}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.newscard .newsimg{display:block;width:calc(100% + 32px);margin:-16px -16px 12px;max-width:none;aspect-ratio:16/9;object-fit:cover;border-radius:var(--radius) var(--radius) 0 0}
.newsfull{max-width:46rem}
.newsimg-full{display:block;width:100%;height:auto;border-radius:var(--radius);margin:0 0 1.2rem}
.prose{font-size:1.08rem;line-height:1.65}
.pageintro{max-width:46rem;padding:1.6rem 0 .2rem}
.maprun{width:100%;height:640px;border:1px solid var(--line,#d8dde6);border-radius:12px;margin-top:1rem;background:#fff}
.prose p{margin:0 0 1em}
.prose img{max-width:100%;height:auto;border-radius:10px;margin:.4em 0 1em;display:block}
.prose ul,.prose ol{margin:0 0 1em;padding-left:1.4em}
.prose h2,.prose h3,.prose h4{margin:1.4em 0 .5em}
.prose blockquote{margin:0 0 1em;padding-left:1em;border-left:4px solid var(--gold);color:var(--muted)}
.prose a{color:var(--navy);font-weight:600}
.card .date{color:var(--muted);font-weight:500;margin:0 0 .3rem}
.stack{display:grid;gap:14px;align-content:start}

/* Map */
.map{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.sea{fill:var(--tint)}
.land{fill:#fff;stroke:var(--navy);stroke-width:1.6;stroke-linejoin:round}
.town-dot{fill:var(--muted)}
.town{font:500 12px var(--body);fill:var(--muted);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.area{font:700 14px var(--body);fill:var(--navy);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.pin .ring{fill:#fff;stroke:var(--navy);stroke-width:3}
.pin .dot{fill:var(--navy)}
.pin.up .ring{fill:var(--gold)}
.leafmap{height:440px;width:100%;background:var(--tint);position:relative;isolation:isolate}
.leafmap.single{height:320px}
@media(max-width:520px){.leafmap{height:340px}.leafmap.single{height:280px}}
.leaflet-container{font-family:var(--body)}
.lpin{display:block;width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--navy);box-sizing:border-box;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.lpin.up{background:var(--gold)}
.ctl{position:relative;width:30px;height:30px}
.ctl .ring{position:absolute;inset:0;border:3.5px solid var(--course);border-radius:50%;box-sizing:border-box}
.dbadge{position:relative;width:48px;height:48px;border:3.5px solid var(--course);border-radius:50%;box-sizing:border-box;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35);color:var(--course);font-family:var(--display);text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dbadge b{font-size:1.2rem;font-weight:700}
.dbadge i{font-style:normal;font-size:.62rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.dbadge .more{position:absolute;top:-8px;right:-8px;min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:var(--navy);font:700 .7rem/18px var(--body);padding:0 4px;box-sizing:border-box}
.legend i.course{background:transparent;border-color:var(--course)}
.leaflet-popup-content{font-size:15px;line-height:1.4;margin:12px 14px}
.leaflet-popup-content .pop+.pop{margin-top:8px}
.leaflet-popup-content a{color:var(--navy);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:.95rem;align-items:center}
.legend i{display:inline-block;width:16px;height:16px;border-radius:50%;border:3px solid var(--navy);background:#fff;vertical-align:-3px;margin-right:6px}
.legend i.up{background:var(--gold)}
.cdots{display:flex;flex-wrap:wrap;gap:.3rem 1rem;margin:.7rem 0 0;font-size:.92rem;font-weight:600;color:var(--navy)}
.cdots i{display:inline-block;width:.8rem;height:.8rem;border-radius:50%;margin-right:.4rem;vertical-align:-.05em;border:1px solid rgba(0,0,0,.25)}
.committee{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:1.1rem;margin-top:1.2rem}
.mcard{text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s,border-top-color .15s;display:flex;flex-direction:column;align-items:center;text-align:center;background:#fff;border:1px solid var(--line,#e3e8ef);border-top:6px solid var(--navy);border-radius:12px;padding:1.4rem 1.1rem 1.3rem}
.mcard:hover,.mcard:focus-visible{border-top-color:var(--gold);transform:translateY(-3px);box-shadow:0 8px 22px rgba(11,42,85,.16)}
.mcard:hover h3{text-decoration:underline;text-underline-offset:3px}
.mcard .mimg{width:120px;height:120px;border-radius:50%;object-fit:cover;flex:none;border:4px solid #fff;box-shadow:0 0 0 1px rgba(11,42,85,.14),0 6px 16px rgba(11,42,85,.2)}
.mcard .minit{width:120px;height:120px;border-radius:50%;flex:none;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font:700 2.2rem var(--body);border:4px solid #fff;box-shadow:0 0 0 1px rgba(11,42,85,.14),0 6px 16px rgba(11,42,85,.2)}
.mcard h3{margin:.9rem 0 .35rem;font-size:1.2rem;color:var(--navy)}
.mcard .mroles{margin:0;color:var(--muted);font-weight:600;line-height:1.45}
.mcard .mrole,.person .mrole{margin:0;color:var(--muted);font-weight:600}
.mroleblk{margin-top:.45rem}
.mroleblk:first-child{margin-top:0}
.person .mmail{display:inline-block;font-size:.95rem}
.mcard .mmail{display:inline-block;font-size:.95rem}
.person{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap;margin-top:.6rem}
.personimg{width:120px;height:120px;border-radius:50%;object-fit:cover;border:4px solid #fff;box-shadow:0 0 0 1px rgba(11,42,85,.14),0 6px 16px rgba(11,42,85,.2)}
.rrow .pill{margin-bottom:.3rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:1rem 0 0;padding:0}
.chips li{background:var(--card);border:1px solid var(--line);border-radius:999px;font-weight:500}
.chips li a{display:block;padding:.3rem .8rem;text-decoration:none;color:var(--ink)}
.chips li:hover{border-color:var(--sky)}
.note{font-size:.92rem;color:var(--muted)}

/* Club hub tiles */
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.tile{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;border-left:6px solid var(--navy)}
.tile:hover{border-color:var(--sky);border-left-color:var(--gold)}
.tile h3{margin-bottom:.35rem}
.tile p{margin:0;color:var(--muted)}

/* Newcomers */
.steps{counter-reset:s;display:grid;gap:14px;padding:0;list-style:none;margin:0}
.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 6px 64px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:16px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--gold);font:700 1.2rem/34px var(--display);text-align:center}

/* Footer */
.site-footer{margin-top:3rem;background:var(--navy-deep);color:#C9D8EA;padding:2rem 0}
.site-footer a{color:#fff}
.site-footer .row{display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;align-items:flex-start}
.site-footer ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 20px}
.motto{font:700 1.4rem var(--display);letter-spacing:.08em;text-transform:uppercase;color:#fff}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="#home" aria-label="Suffolk Orienteering Club, home">
        <img class="logo" src="logo.png" width="46" height="57" alt="SUFFOC logo">
        <span><span class="name">SUFFOC</span><span class="sub">Suffolk Orienteering Club</span></span>
      </a>
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">Menu</button>
    </div>
    <nav class="nav" id="nav" aria-label="Main">
      <ul>
        <li><a href="#home" data-route="home"><svg class="ni" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>Home</a></li>

/* Picture paths come from Pages CMS (e.g. /images/x.jpg); make them relative so they work under /suffoc-site/ too. */
const imgSrc = p => /^https?:/i.test(p) ? p : String(p).replace(/^\/+/, '');

/* News text comes from the Pages CMS rich-text editor (HTML), or plain text with blank lines between paragraphs.
   Only a short list of safe tags is kept. */
const SAFE_TAGS = { P:1, BR:1, STRONG:1, B:1, EM:1, I:1, U:1, A:1, UL:1, OL:1, LI:1, H2:1, H3:1, H4:1, BLOCKQUOTE:1, IMG:1 };
function richHTML(src){
  src = String(src || '').trim();
  if (!src) return '';
  if (!/<\w+[^>]*>/.test(src)) {
    const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return src.split(/\n\s*\n/).map(p => '<p>' + inline(p.trim()).replace(/\n/g, '<br>') + '</p>').join('');
  }
  const doc = new DOMParser().parseFromString('<body>' + src + '</body>', 'text/html');
  const walk = node => {
    let out = '';
    node.childNodes.forEach(c => {
      if (c.nodeType === 3) out += esc(c.textContent);
      else if (c.nodeType === 1) {
        if (/^(SCRIPT|STYLE|IFRAME|OBJECT)$/.test(c.tagName)) return;
        if (c.tagName === 'IMG') {
          const s = c.getAttribute('src') || '';
          if (/^(https?:\/\/|\/|[\w.-]+\/)/i.test(s)) {
            const abs = (/^\/(?!\/)/.test(s) ? (window.BASE || '/').replace(/\/$/, '') + s : s);
            out += '<img src="' + esc(abs) + '" alt="' + esc(c.getAttribute('alt') || '') + '" loading="lazy">';
          }
          return;
        }
        const inner = walk(c);
        if (!SAFE_TAGS[c.tagName]) out += inner;
        else if (c.tagName === 'A') {
          const href = c.getAttribute('href') || '';
          out += /^(https?:|mailto:|#|\/|[\w.-]+\/)/i.test(href) ? '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + inner + '</a>' : inner;
        }
        else out += '<' + c.tagName.toLowerCase() + '>' + inner + '</' + c.tagName.toLowerCase() + '>';
      }
    });
    return out;
  };
  return walk(doc.body);
}
function plainText(src){
  const html = richHTML(src).replace(/<\/(p|li|h\d|blockquote)>/gi, ' ').replace(/<br>/gi, ' ');
  const t = document.createElement('div'); t.innerHTML = html;
  return (t.textContent || '').replace(/\s+/g, ' ').trim();
}
const EXCERPT_WORDS = 35;
function excerpt(src){
  const w = plainText(src).split(' ').filter(Boolean);
  return w.length > EXCERPT_WORDS ? w.slice(0, EXCERPT_WORDS).join(' ') + '…' : w.join(' ');
}

/* Map: equirectangular projection with a cos(latitude) correction. */
function mapSVG(only){
  const keep = k => !only || (Array.isArray(only) ? only.includes(k) : k === only);
  const W = 700, H = 500, LON0 = 0.30, LAT0 = 52.58, KX = 451.6, KY = 735.3;
  const px = (lon, lat) => [ (lon - LON0) * KX, (LAT0 - lat) * KY ];
  const up = new Set(upcoming().map(e => e.area));
  const outline = OUTLINE.map(p => px(p[0], p[1]).map(n => n.toFixed(1)).join(',')).join(' ');
  const towns = TOWNS.map(t => { const [x,y] = px(t.lon, t.lat);
    return `<circle class="town-dot" cx="${x}" cy="${y}" r="3"/><text class="town" x="${x+t.dx}" y="${y+t.dy}" text-anchor="${t.anchor}">${t.name}</text>`; }).join('');
  const pins = Object.entries(AREAS).filter(([k, a]) => keep(k) && isFinite(a.lat) && isFinite(a.lon) && (only || !a.auto)).map(([k, a]) => {
    const isUp = !!only && up.has(k);
    const [x,y] = px(a.lon, a.lat);
    return `<g class="pin${isUp ? ' up' : ''}"><circle class="ring" cx="${x}" cy="${y}" r="9"/><circle class="dot" cx="${x}" cy="${y}" r="2.6"/><text class="area" x="${x+a.dx}" y="${y+a.dy}" text-anchor="${a.anchor}">${a.name}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="mt md">
    <title id="mt">Map of Suffolk showing areas SUFFOC has mapped</title>
    <desc id="md">A simple outline of Suffolk with a marker for each mapped area. Gold markers have an upcoming event.</desc>
    <rect class="sea" width="${W}" height="${H}"/>
    <polygon class="land" points="${outline}"/>
    ${towns}${pins}
  </svg>`;
}
const FALLBACK_NOTE = '<p class="note" style="margin:0;padding:8px 16px">Schematic outline, for layout only</p>';
function mapBlock(mode){
  if (mode === 'upcoming') {
    const ids = [...new Set(upcoming().map(e => e.area))].filter(k => AREAS[k]);
    if (!ids.length) return '';
    return `<div class="map"><div class="leafmap" data-map="upcoming">${mapSVG(ids)}${FALLBACK_NOTE}</div>
      <div class="legend"><span><i class="course"></i>Upcoming events, each marked with its date</span></div></div>`;
  }
  return `<div class="map"><div class="leafmap" data-map="all">${mapSVG()}${FALLBACK_NOTE}</div>
    <div class="legend"><span><i></i>Area the club has mapped</span></div>
  </div>
  <ul class="chips">${Object.entries(AREAS).filter(([k, a]) => !a.auto).map(([k, a]) => `<li><a href="#area-${esc(k)}">${esc(a.name)}</a></li>`).join('')}</ul>`;
}

/* Real map (Leaflet + OpenStreetMap). If Leaflet cannot load, the schematic SVG above stays as a fallback. */
let LMAPS = [];
/* Maps for the permanent orienteering courses: one with every course, or a single pin on a course's own page. */
function initPermMaps(){
  if (!window.L) return;
  document.querySelectorAll('.leafmap[data-map^="perm"]').forEach(el => {
    const fallback = el.innerHTML;
    try {
      const key = el.dataset.map, all = key === 'perm-all';
      const items = all ? PERM : PERM.filter(p => p.id === key.slice(5));
      el.innerHTML = '';
      const map = L.map(el, { scrollWheelZoom:true });
      map.attributionControl.setPrefix(false);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19,
        attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
      const pts = [];
      items.forEach(p => {
        if (!isFinite(p.lat) || !isFinite(p.lon)) return;
        const icon = L.divIcon({ className:'', html:'<div class="ctl"><span class="ring"></span></div>', iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-16] });
        const pop = all ? '<a href="#permanent-' + esc(p.id) + '"><strong>' + esc(p.name) + '</strong></a>' : '<strong>' + esc(p.name) + '</strong>';
        L.marker([p.lat, p.lon], { icon:icon, title:p.name }).addTo(map).bindPopup(pop);
        pts.push([p.lat, p.lon]);
      });
      if (all && pts.length > 1) map.fitBounds(pts, { padding:[40,40], maxZoom:12 });
      else if (pts.length) map.setView(pts[0], all ? 11 : 16);
      else map.setView([52.2, 1.0], 9);
      LMAPS.push(map);
    } catch (err) { el.innerHTML = fallback; }
  });
}
function initMaps(){
  LMAPS.forEach(m => { try { m.remove(); } catch(e){} });
  LMAPS = [];
  if (!window.L) return;
  const up = new Set(upcoming().map(e => e.area));
  document.querySelectorAll('.leafmap').forEach(el => {
    if (/^perm/.test(el.dataset.map || '')) return;  /* permanent courses are drawn by initPermMaps */
    const fallback = el.innerHTML;
    try {
      const key = el.dataset.map;
      el.innerHTML = '';
      const map = L.map(el, { scrollWheelZoom:true });
      map.attributionControl.setPrefix(false);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19,
        attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
      const pts = [];
      const nextBy = {};
      /* Events map: each event sits at its own location (from its grid reference), falling back to its area. Events in the same place share a pin. */
      const groups = {};
      if (key === 'upcoming') upcoming().forEach(e => {
        const ar = AREAS[e.area], p = e.loc || (ar && isFinite(ar.lat) && isFinite(ar.lon) ? ar : null);
        if (!p) return;
        const gk = p.lat.toFixed(4) + ',' + p.lon.toFixed(4);
        (groups[gk] = groups[gk] || { name: ar ? ar.name : e.title, lat: p.lat, lon: p.lon, dx:14, dy:0, anchor:'start', evs: [] }).evs.push(e);
        nextBy[gk] = groups[gk].evs;
      });
      const evKey = key.indexOf('event:') === 0 ? EVENTS.find(x => x.id === key.slice(6)) : null;
      const entries = evKey
        ? (AREAS[evKey.area] || evKey.loc ? [[evKey.area, Object.assign({}, AREAS[evKey.area] || { name:evKey.title, dx:14, dy:0, anchor:'start' }, evKey.loc ? { lat:evKey.loc.lat, lon:evKey.loc.lon } : {})]] : [])
        : (key === 'upcoming' ? Object.entries(groups) : Object.entries(AREAS).filter(([k, a]) => key === 'all' ? !a.auto : k === key));
      entries.forEach(([k, a]) => {
        if (isNaN(a.lat) || isNaN(a.lon)) return;
        let icon;
        if (key === 'upcoming' && nextBy[k]) {
          const n1 = nextBy[k][0], d1 = parseDate(n1.date), more = nextBy[k].length > 1;
          icon = L.divIcon({ className:'', html:'<div class="dbadge"><b>' + d1.getDate() + '</b><i>' + d1.toLocaleString('en-GB', { month:'short' }) + '</i>' + (more ? '<span class="more">' + nextBy[k].length + '</span>' : '') + '</div>',
            iconSize:[48,48], iconAnchor:[24,24], popupAnchor:[0,-26] });
        } else if (key !== 'all' && up.has(k)) {
          icon = L.divIcon({ className:'', html:'<div class="ctl"><span class="ring"></span></div>', iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-16] });
        } else {
          icon = L.divIcon({ className:'', html:'<span class="lpin"></span>', iconSize:[22,22], iconAnchor:[11,11], popupAnchor:[0,-12] });
        }
        const evs = (key === 'upcoming' ? groups[k].evs.slice() : EVENTS.filter(e => e.area === k)).sort((x, y) => key === 'upcoming' ? parseDate(x.date) - parseDate(y.date) : parseDate(y.date) - parseDate(x.date));
        const html = evs.length && key !== 'all' ? evs.map(e => {
          const t = timeRange(e), when = fmtShort.format(parseDate(e.date)) + (t ? ', ' + t : '');
          const name = '<strong>' + esc(e.title) + '</strong>';
          return '<div class="pop">' + (e.detail ? '<a href="#event-' + esc(e.id) + '">' + name + '</a>' : name) + '<br>' + esc(when) + '</div>';
        }).join('') : '<strong>' + esc(a.name) + '</strong>';
        const nEv = EVENTS.filter(e => e.area === k).length;
        const popHtml = key === 'all' ? '<a href="#area-' + esc(k) + '"><strong>' + esc(a.name) + '</strong></a><br>' + (nEv ? nEv + ' event' + (nEv === 1 ? '' : 's') + ' &middot; ' : '') + '<a href="#area-' + esc(k) + '">See events here</a>' : html;
        L.marker([a.lat, a.lon], { icon:icon, title:a.name }).addTo(map).bindPopup(popHtml);
        pts.push([a.lat, a.lon]);
      });
      if (key !== 'all' && key !== 'upcoming' && pts.length) map.setView(pts[0], evKey && evKey.loc ? 16 : 14);
      else if (pts.length) map.fitBounds(pts, { padding:[40,40], maxZoom:key === 'upcoming' ? 12 : 11 });
      else map.setView([52.2, 1.0], 9);
      LMAPS.push(map);
    } catch (err) { el.innerHTML = fallback; }
  });
}

function committeePage(){
  const rank = r => { r = String(r || '').toLowerCase(); const i = ['chair', 'vice', 'secretary', 'treasurer'].findIndex(k => r.indexOf(k) === 0); return i < 0 ? 9 : i; };
  const best = m => Math.min(9, ...m.roles.map(r => rank(r.role)));
  const list = Object.keys(MEMBERS).map(k => Object.assign({ id: k }, MEMBERS[k])).filter(m => m.roles.length)
    .sort((a, b) => best(a) - best(b) || a.roles.map(r => r.role).join().localeCompare(b.roles.map(r => r.role).join()) || String(a.name).localeCompare(String(b.name)));
  const initials = n => String(n).split(/\s+/).filter(Boolean).map(w => w[0]).slice(0, 2).join('').toUpperCase();
  const sentence = m => { const parts = m.roles.map(r => esc(r.role)); return parts.length < 2 ? parts.join('') : parts.slice(0, -1).join(', ') + ' and ' + parts[parts.length - 1]; };
  const card = m => `<a class="mcard" href="#person-${esc(m.id)}">
      ${m.photo ? `<img class="mimg" src="${esc(imgSrc(m.photo))}" alt="" loading="lazy">` : `<span class="minit" aria-hidden="true">${esc(initials(m.name))}</span>`}
      <h3>${esc(m.name)}</h3>
      <p class="mroles">${sentence(m)}</p></a>`;
  return `${pageHead('Committee', 'The people who run the club.', 'club')}
  <div class="wrap"><section class="section">
    <a class="back" href="#club">&larr; Back to Club</a>
    ${list.length ? `<div class="committee">${list.map(card).join('')}</div>` : '<div class="empty">The committee will be listed here soon.</div>'}
  </section></div>`;
}
function clubPage(id){
  if (id === 'committee') return committeePage();
  const c = CLUB.find(x => x.id === id) || (id === 'contact' ? { title:'Contact', desc:'' } : null);
  if (!c) return VIEWS.club();
  const extra = id === 'agm' ? ' The link to the Google Drive folder goes here.' : '';
  return `${pageHead(c.title, '', 'club')}
  <div class="wrap"><section class="section">
    <a class="back" href="#club">&larr; Back to Club</a>
    <div class="empty">This page is a placeholder. The content from the current site moves here.${extra}</div>
  </section></div>`;
}

/* Routing: one page, plain #name hashes. */
const view = document.getElementById('view');
const nav = document.getElementById('nav');
const menuBtn = document.getElementById('menuBtn');
/* Clean URLs. Internally pages are still named like 'event-tunstall'; these turn that into /events/tunstall and back. */
const isRoute = n => n === 'home' || !!VIEWS[n] || /^(club|person|tag|area|news|event|comments|permanent)-./.test(n);
function nameToPath(n){
  let m;
  if (!n || n === 'home') return '';
  if ((m = n.match(/^event-(.+)$/))) return 'events/' + m[1];
  if ((m = n.match(/^permanent-(.+)$/))) return 'permanent/' + m[1];
  if ((m = n.match(/^comments-(.+)$/))) return 'events/' + m[1] + '/comments';
  if ((m = n.match(/^area-(.+)$/))) return 'mapped/' + m[1];
  if ((m = n.match(/^news-(.+)$/))) return 'news/' + m[1];
  if ((m = n.match(/^club-(.+)$/))) return 'club/' + m[1];
  if ((m = n.match(/^person-(.+)$/))) return 'people/' + m[1];
  if ((m = n.match(/^tag-(level|series)-(.+)$/))) return 'events/' + m[1] + '/' + m[2];
  return n;
}
function pathToName(p){
  p = p.replace(/^\/+|\/+$/g, '');
  if (!p) return 'home';
  const s = p.split('/'), rest = s.slice(1).join('/');
  if (s[0] === 'events' && s.length === 3 && s[2] === 'comments' && !/^(level|series)$/.test(s[1])) return 'comments-' + s[1];
  if (s[0] === 'events' && s.length > 1) return /^(level|series)$/.test(s[1]) && s[2] ? 'tag-' + s[1] + '-' + s.slice(2).join('/') : 'event-' + rest;
  if (s[0] === 'mapped' && s.length > 1) return 'area-' + rest;
  if (s[0] === 'news' && s.length > 1) return 'news-' + rest;
  if (s[0] === 'club' && s.length > 1) return 'club-' + rest;
  if (s[0] === 'people' && s.length > 1) return 'person-' + rest;
  if (s[0] === 'permanent' && s.length > 1) return 'permanent-' + rest;
  return s[0];
}
function currentName(){
  if (location.hash.length > 1 && isRoute(location.hash.slice(1))) { /* an older #address: move to the clean one */
    history.replaceState(null, '', BASE + nameToPath(location.hash.slice(1)));
  }
  return pathToName(decodeURIComponent(location.pathname.slice(BASE.length)));
}
function go(name){ history.pushState(null, '', BASE + nameToPath(name)); route(); }
document.addEventListener('click', ev => {
  if (ev.defaultPrevented || ev.button || ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.altKey) return;
  const a = ev.target.closest && ev.target.closest('a');
  if (!a || a.target === '_blank') return;
  const raw = a.dataset.h || (a.getAttribute('href') || ''), name = raw.charAt(0) === '#' ? raw.slice(1) : a.dataset.h;
  if (name && isRoute(name)) { ev.preventDefault(); go(name); }
});
window.addEventListener('popstate', () => route());
/* give every page link its real address, so hovering, copying and opening in a new tab all work */
function cleanLinks(root){
  (root || document).querySelectorAll('a[href^="#"]').forEach(a => {
    const n = a.getAttribute('href').slice(1);
    if (isRoute(n)) { a.dataset.h = n; a.setAttribute('href', BASE + nameToPath(n)); }
  });
}
/* Text the webmaster types under "Page text" in Pages CMS is shown right under the page title. */
function introText(name, html){
  const t = PAGETEXT[name], plain = String(t == null ? '' : t).replace(/<[^>]*>/g, '').replace(/&nbsp;/g, ' ').trim();
  if (!plain) return html;
  const box = '<div class="wrap"><div class="prose pageintro">' + richHTML(t) + '</div></div>';
  const i = html.indexOf('</section>');
  return i < 0 ? html : html.slice(0, i + 10) + box + html.slice(i + 10);
}
function route(){
  const h = currentName();
  let key = 'home', html;
  if (h.startsWith('club-')) { key = 'club'; html = clubPage(h.slice(5)); }
  else if (h.startsWith('person-')) { key = 'club'; html = personPage(h.slice(7)); }
  else if (/^tag-(level|series)-/.test(h)) { key = 'events'; html = tagPage(h.split('-')[1], h.replace(/^tag-(level|series)-/, '')); }
  else if (h.startsWith('area-')) { key = 'events'; html = areaPage(h.slice(5)); }
  else if (h.startsWith('news-')) { key = 'news'; html = newsPage(h.slice(5)); }
  else if (h.startsWith('permanent-')) { key = 'anytime'; html = permanentPage(h.slice(10)); }
  else if (h.startsWith('comments-')) { key = 'results'; html = commentsPage(h.slice(9)); }
  else if (h.startsWith('event-')) { key = 'events'; html = eventPage(h.slice(6)); }
  else if (VIEWS[h]) { key = h === 'mapped' ? 'events' : ((h === 'permanent' || h === 'maprun') ? 'anytime' : h); html = introText(h, VIEWS[h]()); }
  else { html = VIEWS.home(); }
  view.innerHTML = html;
  cleanLinks(view);
  initMaps();
  initPermMaps();
  document.querySelectorAll('.nav a[data-route]').forEach(a => {
    if (a.dataset.route === key) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  nav.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false');
  window.scrollTo(0, 0);
}
menuBtn.addEventListener('click', () => {
  const open = nav.classList.toggle('open');
  menuBtn.setAttribute('aria-expanded', String(open));
});
cleanLinks(document);
status('loading data...');
Promise.all([
  fetch('data/areas.json', { cache:'no-cache' }).then(r => { if(!r.ok) throw new Error('areas.json HTTP ' + r.status); return r.json(); }),
  fetch('data/events.json', { cache:'no-cache' }).then(r => { if(!r.ok) throw new Error('events.json HTTP ' + r.status); return r.json(); }),
  fetch('data/news.json', { cache:'no-cache' }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
  fetch('data/members.json', { cache:'no-cache' }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
  fetch('data/permanent.json', { cache:'no-cache' }).then(r => r.ok ? r.json() : {}).catch(() => ({})),
  fetch('data/pagetext.json', { cache:'no-cache' }).then(r => r.ok ? r.json() : {}).catch(() => ({}))
]).then(([a, e, n, m, pm, pt]) => { PAGETEXT = (pt && typeof pt === 'object' && !Array.isArray(pt)) ? pt : {}; loadPermanent(asList(pm)); loadMembers(asList(m)); loadData(asList(a), asList(e)); loadNews(asList(n)); route(); status('loaded ' + EVENTS.length + ' events, ' + NEWS.length + ' news, ' + Object.keys(AREAS).length + ' areas' + (SKIPPED.length ? '. SKIPPED (needs a Date as YYYY-MM-DD): ' + SKIPPED.join('; ') : '')); })
  .catch(err => { status('FAILED: ' + err.message); view.innerHTML = '<div class="wrap"><div class="empty">Could not load the event data: ' + esc(err.message) + '</div></div>'; });
</script>
</body>
