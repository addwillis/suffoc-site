<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUFFOC Website Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout idea: flat seven-item menu, no sub-menus; Club is a hub of tiles.
     Contour-line hero, control-circle map pins. Single light theme by choice. */
  --navy:#0B2A55;
  --navy-deep:#071C3B;
  --sky:#4DA3E0;
  --tint:#E8F3FB;
  --gold:#F2B705;--course:#A3238E;
  --paper:#F5F5F5;
  --card:#FFFFFF;
  --ink:#222222;
  --muted:#5A6676;
  --line:#D7DEE7;
  --display:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  --body:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --radius:10px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.55 var(--body);-webkit-text-size-adjust:100%}
a{color:var(--navy)}
a:hover{text-decoration-thickness:2px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:4px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--display);color:var(--navy);margin:0;line-height:1.05;text-wrap:balance}
h2{font-size:clamp(1.55rem,5.5vw,2rem);font-weight:700;letter-spacing:.01em;text-transform:uppercase}
h3{font-size:1.4rem;font-weight:700;letter-spacing:.01em}
p{margin:0 0 1rem;max-width:65ch}

/* Header */
.site-header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20;border-bottom:3px solid var(--gold)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.brand svg{flex:none}
.brand .name{font:700 1.75rem/1 var(--display);letter-spacing:.05em}
.brand .logo{display:block;height:76px;width:auto;margin:6px 0}
@media (max-width:520px){.brand .logo{height:54px}}
.brand .sub{display:block;font:600 .72rem/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:#BFD3EA;margin-top:3px}
.proto-chip{font:600 .7rem/1 var(--body);letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:var(--navy);padding:.3rem .5rem;border-radius:999px;margin-left:6px}
.menu-btn{background:transparent;color:#fff;border:2px solid #fff;border-radius:8px;font:600 1rem var(--body);padding:.45rem .8rem;cursor:pointer}
@media (max-width:520px){.brand .sub{display:none}.proto-chip{font-size:.62rem;padding:.25rem .4rem}}
.nav{display:none;padding-bottom:12px}
.nav.open{display:block}
.nav ul{list-style:none;margin:0;padding:0}
.nav a{display:block;color:#fff;text-decoration:none;font:600 1.05rem var(--body);padding:.7rem .25rem;border-bottom:1px solid rgba(255,255,255,.14)}
.nav a[aria-current="page"]{color:var(--gold)}
.nav .join{display:inline-block;margin-top:.8rem;background:var(--gold);color:var(--navy);border:0;border-radius:8px;padding:.6rem 1.1rem;font-weight:700}
@media (min-width:880px){
  .menu-btn{display:none}
  .nav,.nav.open{display:block;padding:0}
  .nav ul{display:flex;align-items:center;gap:2px}
  .nav a{border-bottom:3px solid transparent;padding:1.2rem .7rem 1rem;font-size:1rem}
  .nav a[aria-current="page"]{border-bottom-color:var(--gold)}
  .nav .join{margin:0 0 0 10px;padding:.5rem 1rem;border-bottom:0}
}

/* Hero */
.hero{position:relative;background:var(--navy);color:#fff;overflow:hidden}
.hero .contours{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;padding-top:3.2rem;padding-bottom:3.6rem}
.hero h1{color:#fff;font-size:clamp(2.7rem,8vw,5rem);font-weight:700;text-transform:uppercase;letter-spacing:.01em;max-width:11ch}
.hero .lead{font-size:1.2rem;color:#DCE8F5;margin:1.1rem 0 1.6rem;max-width:52ch}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;font:700 1.02rem var(--body);text-decoration:none;padding:.75rem 1.25rem;border-radius:8px;border:2px solid transparent}
.btn.gold{background:var(--gold);color:var(--navy)}
.btn.ghost{color:#fff;border-color:rgba(255,255,255,.7)}
.btn.line{color:var(--navy);border-color:var(--navy)}
.btn:hover{filter:brightness(1.08)}
.btn.big{font-size:1.3rem;padding:1rem 2.2rem;border-radius:10px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.facts dd.code a{color:var(--navy);text-decoration:underline;text-underline-offset:3px}
.entrycard{background:var(--tint);border-color:#bcd7ec;text-align:center}
.entrycard .btn.big{display:block;width:100%;text-align:center}
.entrycard .note-line{margin:.8rem 0 0;color:var(--navy);font-weight:600}
.btn.small{font-size:.92rem;padding:.4rem .8rem;border-width:1.5px}

/* Sections */
.section{padding:2.4rem 0 .6rem}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:1.1rem}
.more{font-weight:600;white-space:nowrap}
.pagehead{padding:2.2rem 0 1.2rem;border-bottom:1px solid var(--line);background:var(--card)}
.pagehead h1{font-size:clamp(2.2rem,6vw,3.4rem);text-transform:uppercase;font-weight:700}
.pagehead .lead{margin:.7rem 0 0;color:var(--muted);font-size:1.1rem}
.back{display:inline-block;margin-bottom:.8rem;font-weight:600}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:1.2rem}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.two-col{display:grid;gap:28px;grid-template-columns:1fr}
@media (min-width:860px){.two-col{grid-template-columns:1fr 1fr}}

/* Event cards */
.events{display:grid;gap:14px}
.event{display:grid;grid-template-columns:72px 1fr;gap:16px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.datebox{background:var(--navy);color:#fff;border-radius:8px;text-align:center;padding:.55rem .2rem;align-self:start;font-family:var(--display)}
.datebox .wd{display:block;font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:#BFD3EA}
.datebox .day{display:block;font-size:2.2rem;font-weight:700;line-height:1}
.datebox .mon{display:block;font-size:1rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.pill{display:inline-block;font:600 .75rem/1 var(--body);letter-spacing:.06em;text-transform:uppercase;background:var(--tint);color:var(--navy);padding:.3rem .55rem;border-radius:999px;margin-bottom:.45rem}
.meta{color:var(--muted);margin:.3rem 0 .7rem;font-weight:500}
.links{display:flex;flex-wrap:wrap;gap:8px}

/* Event page */
.title-link{color:inherit;text-decoration:none}
.title-link:hover{text-decoration:underline;text-decoration-thickness:2px}
.detail-grid{display:grid;gap:20px;grid-template-columns:minmax(0,1fr);padding-top:1.6rem}
@media (min-width:900px){
  .detail-grid{grid-template-columns:minmax(0,1fr) 340px}
  .detail-grid > aside{grid-column:2;grid-row:1}
}
dl.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 16px;margin:.8rem 0 0}
dl.facts dt{color:var(--muted);font-weight:500}
dl.facts dd{margin:0;font-weight:600;overflow-wrap:anywhere}
.detail-grid > *{min-width:0}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600;font-size:.98rem}
.todo{border-style:dashed;background:transparent}
.event-title{font-size:clamp(2rem,5.5vw,3rem)!important}

/* Cards */
.year{margin:0 0 1rem}
.year>summary{cursor:pointer;list-style:none;display:flex;align-items:baseline;gap:.8rem;font:700 1.7rem var(--display);color:var(--navy);padding:.3rem 0;text-transform:uppercase;letter-spacing:.02em}
.year>summary::-webkit-details-marker{display:none}
.year>summary::before{content:"\25B8";font-size:1.1rem;transition:transform .15s}
.year[open]>summary::before{transform:rotate(90deg)}
.year>summary .count{font:500 1rem var(--body);color:var(--muted);text-transform:none;letter-spacing:0}
.rlist{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-top:.5rem;overflow:hidden}
.rrow{display:grid;grid-template-columns:5rem 1fr;gap:.35rem 1rem;align-items:start;padding:.85rem 1rem;border-top:1px solid var(--line)}
.rrow:first-child{border-top:0}
.rrow .rdate{font:700 1.05rem var(--body);color:var(--navy);white-space:nowrap}
.rrow h3{font-size:1.1rem;margin:0}
.rrow .pill{margin:0 0 0 .5rem;vertical-align:2px}
.rrow .links{grid-column:2;margin-top:.35rem}
.rrow .tbc{grid-column:2;margin:.1rem 0 0;color:var(--muted)}
@media(min-width:760px){.rrow{grid-template-columns:5rem minmax(0,1fr) minmax(0,1.6fr);align-items:center}.rrow .links,.rrow .tbc{grid-column:3;margin:0;justify-content:flex-end;text-align:right}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card .date{color:var(--muted);font-weight:500;margin:0 0 .3rem}
.stack{display:grid;gap:14px;align-content:start}

/* Map */
.map{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.sea{fill:var(--tint)}
.land{fill:#fff;stroke:var(--navy);stroke-width:1.6;stroke-linejoin:round}
.town-dot{fill:var(--muted)}
.town{font:500 12px var(--body);fill:var(--muted);paint-order:stroke;stroke:#fff;stroke-width:3px;stroke-linejoin:round}
.area{font:700 14px var(--body);fill:var(--navy);paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.pin .ring{fill:#fff;stroke:var(--navy);stroke-width:3}
.pin .dot{fill:var(--navy)}
.pin.up .ring{fill:var(--gold)}
.leafmap{height:440px;width:100%;background:var(--tint);position:relative;isolation:isolate}
.leafmap.single{height:320px}
@media(max-width:520px){.leafmap{height:340px}.leafmap.single{height:280px}}
.leaflet-container{font-family:var(--body)}
.lpin{display:block;width:22px;height:22px;border-radius:50%;background:#fff;border:4px solid var(--navy);box-sizing:border-box;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.lpin.up{background:var(--gold)}
.ctl{position:relative;width:30px;height:30px}
.ctl .ring{position:absolute;inset:0;border:3.5px solid var(--course);border-radius:50%;box-sizing:border-box}
.ctl .num{position:absolute;left:25px;top:-12px;font:700 20px/1 var(--display);color:var(--course);white-space:nowrap;text-shadow:-1.5px -1.5px 0 #fff,1.5px -1.5px 0 #fff,-1.5px 1.5px 0 #fff,1.5px 1.5px 0 #fff,0 0 4px #fff}
.ctl .tri{position:absolute;left:0;top:0;width:30px;height:30px;overflow:visible}
.ctl .fin{position:absolute;inset:-4px;border:3.5px solid var(--course);border-radius:50%;box-sizing:border-box}
.ctl .fin2{position:absolute;inset:3px;border:3.5px solid var(--course);border-radius:50%;box-sizing:border-box}
.legend i.course{background:transparent;border-color:var(--course)}
.leaflet-popup-content{font-size:15px;line-height:1.4;margin:12px 14px}
.leaflet-popup-content a{color:var(--navy);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;padding:12px 16px;border-top:1px solid var(--line);color:var(--muted);font-size:.95rem;align-items:center}
.legend i{display:inline-block;width:16px;height:16px;border-radius:50%;border:3px solid var(--navy);background:#fff;vertical-align:-3px;margin-right:6px}
.legend i.up{background:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:1rem 0 0;padding:0}
.chips li{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:.3rem .8rem;font-weight:500}
.note{font-size:.92rem;color:var(--muted)}

/* Club hub tiles */
.tiles{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.tile{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;border-left:6px solid var(--navy)}
.tile:hover{border-color:var(--sky);border-left-color:var(--gold)}
.tile h3{margin-bottom:.35rem}
.tile p{margin:0;color:var(--muted)}

/* Newcomers */
.steps{counter-reset:s;display:grid;gap:14px;padding:0;list-style:none;margin:0}
.steps li{counter-increment:s;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 6px 64px;position:relative}
.steps li::before{content:counter(s);position:absolute;left:16px;top:14px;width:34px;height:34px;border-radius:50%;background:var(--navy);color:var(--gold);font:700 1.2rem/34px var(--display);text-align:center}

/* Footer */
.site-footer{margin-top:3rem;background:var(--navy-deep);color:#C9D8EA;padding:2rem 0}
.site-footer a{color:#fff}
.site-footer .row{display:flex;flex-wrap:wrap;gap:16px 40px;justify-content:space-between;align-items:flex-start}
.site-footer ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 20px}
.motto{font:700 1.4rem var(--display);letter-spacing:.08em;text-transform:uppercase;color:#fff}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="#home" aria-label="Suffolk Orienteering Club, home">
        <img class="logo" src="logo.png" width="46" height="57" alt="SUFFOC logo">
        <span><span class="name">SUFFOC</span><span class="sub">Suffolk Orienteering Club</span></span>
        <span class="proto-chip">Prototype</span>
      </a>
      <button class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="nav">Menu</button>
    </div>
    <nav class="nav" id="nav" aria-label="Main">
      <ul>
        <li><a href="#home" data-route="home">Home</a></li>
        <li><a href="#events" data-route="events">Events</a></li>
        <li><a href="#results" data-route="results">Results</a></li>
        <li><a href="#news" data-route="news">News</a></li>
        <li><a href="#anytime" data-route="anytime">Anytime O</a></li>
        <li><a href="#club" data-route="club">Club</a></li>
        <li><a href="#newcomers" data-route="newcomers">Newcomers</a></li>
        <li><a class="join" href="#club-membership">Join</a></li>
      </ul>
    </nav>
  </div>
</header>

<main id="view" tabindex="-1"></main>

<footer class="site-footer">
  <div class="wrap row">
    <div>
      <div class="motto">Festina Lente</div>
      <p style="margin:.4rem 0 0">&copy; Suffolk Orienteering Club</p>
    </div>
    <ul>
      <li><a href="#club-contact">Contact</a></li>
      <li><a href="https://www.suffoc.co.uk/safeguarding-and-welfare" target="_blank" rel="noopener">Safeguarding and Welfare</a></li>
      <li><a href="https://www.suffoc.co.uk/data-privacy" target="_blank" rel="noopener">Data Privacy Policy</a></li>
      <li><a href="https://www.facebook.com/SUFFOC" target="_blank" rel="noopener">Facebook</a></li>
    </ul>
  </div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
/* =====================================================================
   EDIT HERE: the site's content lives in these lists.
   Events and areas are in data/events.json and data/areas.json (edit them in Pages CMS). The lists below are news and club pages.
   Coordinates are approximate sample values.
   ===================================================================== */
const BUILD = 'build 30';
function status(msg){ let el = document.getElementById('status'); if(!el){ el = document.createElement('p'); el.id='status'; el.style.cssText='position:fixed;left:0;right:0;bottom:0;margin:0;padding:.4rem .8rem;background:#fff3cd;color:#222;font:13px sans-serif;z-index:99'; document.body.appendChild(el);} el.textContent = BUILD + ': ' + msg; }
window.addEventListener('error', e => status('JS error: ' + e.message));
window.addEventListener('unhandledrejection', e => status('Promise error: ' + (e.reason && e.reason.message || e.reason)));
let AREAS = {}, EVENTS = [], SKIPPED = [];
/* Event and area data live in data/*.json (edited through Pages CMS). */
const pairs = (list, k1, k2) => (list || []).filter(x => x && x[k1] && x[k2]).map(x => [x[k1], x[k2]]);
const asList = d => Array.isArray(d) ? d : (d && Object.values(d).find(Array.isArray)) || [];
function loadData(areas, events){
  AREAS = {};
  areas.forEach(a => { let lat = parseFloat(a.lat), lon = parseFloat(a.lon);
    if (!isFinite(lat) || !isFinite(lon)) { const g = gridToLatLon(a.gridRef); lat = g ? g.lat : NaN; lon = g ? g.lon : NaN; }
    AREAS[a.id] = { name:a.name, lat:lat, lon:lon, dx:+(a.label_dx||14), dy:+(a.label_dy||0), anchor:a.label_anchor||'start' }; });
  const ok = e => e && e.title && /^\d{4}-\d{2}-\d{2}$/.test(String(e.date || '').trim());
  SKIPPED = events.filter(e => !ok(e)).map(e => (e && e.title) || '(no name)');
  events = events.filter(ok);
  events.forEach(e => { e.date = String(e.date).trim(); });
  EVENTS = events.map(e => {
    const o = Object.assign({}, e);
    o.results = pairs(e.results, 'label', 'url');
    const d = e.detail;
    if (d && (d.about || d.postcode || d.w3w || d.organiser || d.planner || d.controller)) {
      o.detail = Object.assign({}, d, { address: (d.address || []).filter(Boolean), officials: [['Organiser', d.organiser], ['Planner', d.planner], ['Controller', d.controller]].filter(x => x[1]).concat(pairs(d.officials, 'role', 'name')), docs: pairs(d.docs, 'label', 'url') });
    } else delete o.detail;
    o.loc = o.detail && o.detail.gridRef ? gridToLatLon(o.detail.gridRef) : null;
    return o;
  });
  const slug = s => String(s == null ? '' : s).toLowerCase().replace(/[^a-z0-9]/g, '');
  EVENTS.forEach(o => {
    const key = slug(o.area);
    if (!key) return;
    let id = Object.keys(AREAS).find(k => slug(k) === key || slug(AREAS[k].name) === key);
    if (!id && o.loc) { id = key; AREAS[id] = { name:String(o.area).trim(), lat:o.loc.lat, lon:o.loc.lon, dx:14, dy:0, anchor:'start' }; }
    if (id) o.area = id;
  });
}
const NEWS = [
  { title:'SUFFOC at the Compass Sport Final', date:'2026-10-18',
    text:'26 members travelled to East Sussex for the 2026 Compass Sport Trophy final. It is only the fifth time the club has qualified.',
    link:'https://www.suffoc.co.uk/news/suffoc-compass-sport-final' },
  { title:'SUFFOC 2026 AGM', date:'2026-08-26',
    text:'The AGM came with a short score event in Christchurch Park beforehand, and a promise that nobody would be forced into a role.',
    link:'https://www.suffoc.co.uk/news/suffoc-2026-agm' }
];

const CLUB = [
  { id:'about',         title:'About Us',          desc:'Who we are, where we run, and our club history.' },
  { id:'committee',     title:'Committee',         desc:'Who does what on the committee.' },
  { id:'league',        title:'League',            desc:'Club league standings and how it works.' },
  { id:'championships', title:'Club Championships',desc:'Annual championship results and awards.' },
  { id:'juniors',       title:'Juniors',           desc:'Junior orienteering and who to contact.' },
  { id:'kit',           title:'Club Kit',          desc:'Club clothing and how to get it.' },
  { id:'agm',           title:'AGM Minutes',       desc:'Minutes from past AGMs, kept on Google Drive.' },
  { id:'membership',    title:'Membership',        desc:'How to join and what membership includes.' }
];

/* Rough outline of Suffolk as [lon, lat]. Schematic only. */
const OUTLINE = [
  [1.740,52.520],[1.750,52.480],[1.735,52.420],[1.680,52.330],[1.640,52.270],[1.610,52.180],[1.600,52.090],
  [1.470,52.030],[1.410,51.990],[1.330,51.935],[1.280,51.950],[1.150,51.955],[1.060,51.945],[0.870,51.975],
  [0.760,51.975],[0.715,52.025],[0.640,52.050],[0.560,52.060],[0.440,52.075],[0.390,52.140],[0.380,52.240],
  [0.480,52.300],[0.490,52.390],[0.620,52.450],[0.760,52.410],[0.950,52.390],[1.110,52.380],[1.300,52.400],
  [1.440,52.450],[1.570,52.460],[1.640,52.500]
];
const TOWNS = [
  { name:'Ipswich',         lat:52.057, lon:1.155, dx:8,  dy:4,   anchor:'start' },
  { name:'Bury St Edmunds', lat:52.246, lon:0.717, dx:0,  dy:-9,  anchor:'middle'},
  { name:'Lowestoft',       lat:52.475, lon:1.751, dx:-10, dy:22,  anchor:'end'   },
  { name:'Felixstowe',      lat:51.960, lon:1.350, dx:-10, dy:-8,  anchor:'end'   }
];

/* =====================================================================
   Everything below builds the pages from the lists above.
   ===================================================================== */
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const parseDate = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
/* OS National Grid reference -> WGS84 latitude / longitude (accurate to a few metres). */
function gridToEN(ref){
  const m = String(ref == null ? '' : ref).toUpperCase().replace(/\s+/g, '').match(/^([A-Z]{2})(\d{2,10})$/);
  if (!m || m[2].length % 2) return null;
  const h = m[2].length / 2;
  let l1 = m[1].charCodeAt(0) - 65, l2 = m[1].charCodeAt(1) - 65;
  if (l1 > 7) l1--; if (l2 > 7) l2--;
  const e100 = ((l1 - 2) % 5) * 5 + (l2 % 5), n100 = (19 - Math.floor(l1 / 5) * 5) - Math.floor(l2 / 5);
  if (e100 < 0 || e100 > 6 || n100 < 0 || n100 > 12) return null;
  const sc = Math.pow(10, 5 - h);
  return { e:e100 * 100000 + parseInt(m[2].slice(0, h), 10) * sc, n:n100 * 100000 + parseInt(m[2].slice(h), 10) * sc };
}
function gridToLatLon(ref){
  const en = gridToEN(ref); if (!en) return null;
  const rad = Math.PI / 180;
  /* Inverse Transverse Mercator on the Airy 1830 ellipsoid (OSGB36) */
  let a = 6377563.396, b = 6356256.909, F0 = 0.9996012717, lat0 = 49 * rad, lon0 = -2 * rad, N0 = -100000, E0 = 400000;
  const e2 = 1 - (b * b) / (a * a), n = (a - b) / (a + b);
  let lat = lat0, M = 0, guard = 0;
  do {
    lat = (en.n - N0 - M) / (a * F0) + lat;
    const Ma = (1 + n + (5 / 4) * n * n + (5 / 4) * n * n * n) * (lat - lat0);
    const Mb = (3 * n + 3 * n * n + (21 / 8) * n * n * n) * Math.sin(lat - lat0) * Math.cos(lat + lat0);
    const Mc = ((15 / 8) * n * n + (15 / 8) * n * n * n) * Math.sin(2 * (lat - lat0)) * Math.cos(2 * (lat + lat0));
    const Md = (35 / 24) * n * n * n * Math.sin(3 * (lat - lat0)) * Math.cos(3 * (lat + lat0));
    M = b * F0 * (Ma - Mb + Mc - Md);
  } while (Math.abs(en.n - N0 - M) >= 0.00001 && ++guard < 50);
  const sin = Math.sin(lat), cos = Math.cos(lat), tan = Math.tan(lat), sec = 1 / cos;
  const nu = a * F0 / Math.sqrt(1 - e2 * sin * sin), rho = a * F0 * (1 - e2) / Math.pow(1 - e2 * sin * sin, 1.5), eta2 = nu / rho - 1;
  const t2 = tan * tan, t4 = t2 * t2, t6 = t4 * t2, nu3 = nu * nu * nu, nu5 = nu3 * nu * nu, nu7 = nu5 * nu * nu;
  const VII = tan / (2 * rho * nu), VIII = tan / (24 * rho * nu3) * (5 + 3 * t2 + eta2 - 9 * t2 * eta2), IX = tan / (720 * rho * nu5) * (61 + 90 * t2 + 45 * t4);
  const X = sec / nu, XI = sec / (6 * nu3) * (nu / rho + 2 * t2), XII = sec / (120 * nu5) * (5 + 28 * t2 + 24 * t4), XIIA = sec / (5040 * nu7) * (61 + 662 * t2 + 1320 * t4 + 720 * t6);
  const dE = en.e - E0;
  const phi = lat - VII * Math.pow(dE, 2) + VIII * Math.pow(dE, 4) - IX * Math.pow(dE, 6);
  const lam = lon0 + X * dE - XI * Math.pow(dE, 3) + XII * Math.pow(dE, 5) - XIIA * Math.pow(dE, 7);
  /* Helmert datum shift OSGB36 -> WGS84 */
  const nu1 = a / Math.sqrt(1 - e2 * Math.sin(phi) * Math.sin(phi));
  const x1 = nu1 * Math.cos(phi) * Math.cos(lam), y1 = nu1 * Math.cos(phi) * Math.sin(lam), z1 = (nu1 * (1 - e2)) * Math.sin(phi);
  const tx = 446.448, ty = -125.157, tz = 542.060, s = -20.4894 / 1e6 + 1, as = Math.PI / 648000;
  const rx = 0.1502 * as, ry = 0.2470 * as, rz = 0.8421 * as;
  const x2 = tx + x1 * s - y1 * rz + z1 * ry, y2 = ty + x1 * rz + y1 * s - z1 * rx, z2 = tz - x1 * ry + y1 * rx + z1 * s;
  a = 6378137; b = 6356752.314245; const e2b = 1 - (b * b) / (a * a), p = Math.sqrt(x2 * x2 + y2 * y2);
  let ph = Math.atan2(z2, p * (1 - e2b)), prev;
  do { prev = ph; const nu2 = a / Math.sqrt(1 - e2b * Math.sin(ph) * Math.sin(ph)); ph = Math.atan2(z2 + e2b * nu2 * Math.sin(ph), p); } while (Math.abs(ph - prev) > 1e-12);
  return { lat:ph / rad, lon:Math.atan2(y2, x2) / rad };
}

const now = new Date();
const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const fmtShort = new Intl.DateTimeFormat('en-GB', { day:'numeric', month:'short', year:'numeric' });
const fmtLong = new Intl.DateTimeFormat('en-GB', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
const ext = 'target="_blank" rel="noopener"';

/* An event moves from Events to Results this many minutes after its course close time
   (or at the end of the day if no close time is set). Change the number to adjust. */
const GRACE_MINUTES = 60;
const clean = v => String(v == null ? '' : v).trim();
const rng = (a, b) => a && b ? a + '\u2013' + b : (a || b || '');
/* Timings come from e.timings (older entries with plain time / courseClose still work). */
function tm(e){
  const t = e.timings || {};
  const startsFrom = clean(t.startsFrom || e.time), close = clean(t.courseClose || e.courseClose);
  return { regFrom:clean(t.registrationFrom), regTo:clean(t.registrationTo), startsFrom:startsFrom, startsTo:clean(t.startsTo),
           close:close, sumStart:startsFrom || clean(t.registrationFrom), sumEnd:close };
}
const timeRange = e => { const t = tm(e); return t.sumStart && t.sumEnd ? t.sumStart + '\u2013' + t.sumEnd : t.sumStart || (t.sumEnd ? 'closes ' + t.sumEnd : ''); };
function endsAt(e){
  const d = parseDate(e.date);
  const m = /^(\d{1,2})[:.](\d{2})/.exec(tm(e).sumEnd);
  if (m) { d.setHours(+m[1], +m[2] + GRACE_MINUTES, 0, 0); return d; }
  d.setHours(23, 59, 59, 999); return d;
}
const isPast = e => new Date() >= endsAt(e);
const upcoming = () => EVENTS.filter(e => !isPast(e)).sort((a,b) => parseDate(a.date) - parseDate(b.date));
const past = () => EVENTS.filter(e => isPast(e)).sort((a,b) => parseDate(b.date) - parseDate(a.date));

function eventCard(e){
  const d = parseDate(e.date);
  const wd = d.toLocaleString('en-GB', { weekday:'short' });
  const mon = d.toLocaleString('en-GB', { month:'short' });
  const place = AREAS[e.area] ? AREAS[e.area].name : (e.area || '');
  return `<article class="event">
    <div class="datebox" aria-hidden="true"><span class="wd">${wd}</span><span class="day">${d.getDate()}</span><span class="mon">${mon}</span></div>
    <div>
      <span class="pill">${esc(e.type)}</span>
      <h3>${e.detail ? `<a class="title-link" href="#event-${esc(e.id)}">${esc(e.title)}</a>` : esc(e.title)}</h3>
      <p class="meta">${timeRange(e) ? esc(timeRange(e)) + ' &middot; ' : ''}${esc(place)}</p>
      <div class="links">
        ${e.entryUrl ? `<a class="btn small gold" href="${esc(e.entryUrl)}" ${ext}>Enter online</a>` : ''}
        ${e.detail ? `<a class="btn small ${e.entryUrl ? 'line' : 'gold'}" href="#event-${esc(e.id)}">Event page</a>` : (e.link ? `<a class="btn small line" href="${esc(e.link)}" ${ext}>Event details</a>` : '')}
        ${e.pdf ? `<a class="btn small line" href="${esc(e.pdf)}" ${ext}>Preliminary details (PDF)</a>` : ''}
      </div>
    </div>
  </article>`;
}
const eventsList = list => list.length
  ? `<div class="events">${list.map(eventCard).join('')}</div>`
  : `<div class="empty">No upcoming events are listed yet. Check back soon.</div>`;

function resultCard(e){
  const place = AREAS[e.area] ? AREAS[e.area].name : '';
  const has = e.results && e.results.length;
  return `<article class="card">
    <p class="date">${fmtShort.format(parseDate(e.date))}</p>
    ${e.type && e.type !== 'Local event' ? `<span class="pill">${esc(e.type)}</span>` : ''}
    <h3>${titleLink(e)}</h3>
    ${has
      ? `<div class="links" style="margin-top:.8rem">${e.results.map(l => `<a class="btn small line" href="${esc(l[1])}" ${ext}>${esc(l[0])}</a>`).join('')}</div>`
      : `<p class="meta" style="margin-top:.6rem">Results to follow</p>`}
  </article>`;
}
/* Title for a result: the event's own page if it has one, otherwise its old event page link. */
function titleLink(e){
  if (e.detail) return `<a class="title-link" href="#event-${esc(e.id)}">${esc(e.title)}</a>`;
  if (e.link) return `<a class="title-link" href="${esc(e.link)}" ${ext}>${esc(e.title)}</a>`;
  return esc(e.title);
}
function resultRow(e){
  const d = parseDate(e.date), has = e.results && e.results.length;
  return `<div class="rrow">
    <span class="rdate">${d.getDate()} ${d.toLocaleString('en-GB', { month:'short' })}</span>
    <h3>${titleLink(e)}${e.type && e.type !== 'Local event' ? `<span class="pill">${esc(e.type)}</span>` : ''}</h3>
    ${has ? `<div class="links">${e.results.map(l => `<a class="btn small line" href="${esc(l[1])}" ${ext}>${esc(l[0])}</a>`).join('')}</div>` : `<p class="tbc">Results to follow</p>`}
  </div>`;
}
function newsCard(n){
  return `<article class="card">
    <p class="date">${fmtShort.format(parseDate(n.date))}</p>
    <h3>${esc(n.title)}</h3>
    <p style="margin-top:.5rem">${esc(n.text)}</p>
    <a href="${esc(n.link)}" ${ext}><strong>Read more</strong></a>
  </article>`;
}

/* Map: equirectangular projection with a cos(latitude) correction. */
function mapSVG(only){
  const keep = k => !only || (Array.isArray(only) ? only.includes(k) : k === only);
  const W = 700, H = 500, LON0 = 0.30, LAT0 = 52.58, KX = 451.6, KY = 735.3;
  const px = (lon, lat) => [ (lon - LON0) * KX, (LAT0 - lat) * KY ];
  const up = new Set(upcoming().map(e => e.area));
  const outline = OUTLINE.map(p => px(p[0], p[1]).map(n => n.toFixed(1)).join(',')).join(' ');
  const towns = TOWNS.map(t => { const [x,y] = px(t.lon, t.lat);
    return `<circle class="town-dot" cx="${x}" cy="${y}" r="3"/><text class="town" x="${x+t.dx}" y="${y+t.dy}" text-anchor="${t.anchor}">${t.name}</text>`; }).join('');
  const pins = Object.entries(AREAS).filter(([k, a]) => keep(k) && isFinite(a.lat) && isFinite(a.lon)).map(([k, a]) => {
    const isUp = up.has(k);
    const [x,y] = px(a.lon, a.lat);
    return `<g class="pin${isUp ? ' up' : ''}"><circle class="ring" cx="${x}" cy="${y}" r="9"/><circle class="dot" cx="${x}" cy="${y}" r="2.6"/><text class="area" x="${x+a.dx}" y="${y+a.dy}" text-anchor="${a.anchor}">${a.name}</text></g>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="mt md">
    <title id="mt">Map of Suffolk showing areas SUFFOC has mapped</title>
    <desc id="md">A simple outline of Suffolk with a marker for each mapped area. Gold markers have an upcoming event.</desc>
    <rect class="sea" width="${W}" height="${H}"/>
    <polygon class="land" points="${outline}"/>
    ${towns}${pins}
  </svg>`;
}
const FALLBACK_NOTE = '<p class="note" style="margin:0;padding:8px 16px">Schematic outline, for layout only</p>';
function mapBlock(mode){
  if (mode === 'upcoming') {
    const ids = [...new Set(upcoming().map(e => e.area))].filter(k => AREAS[k]);
    if (!ids.length) return '';
    return `<div class="map"><div class="leafmap" data-map="upcoming">${mapSVG(ids)}${FALLBACK_NOTE}</div>
      <div class="legend"><span><i class="course"></i>Upcoming events in date order: triangle (first), numbered circles, double circle (last)</span></div></div>`;
  }
  return `<div class="map"><div class="leafmap" data-map="all">${mapSVG()}${FALLBACK_NOTE}</div>
    <div class="legend"><span><i class="course"></i>Upcoming event</span><span><i></i>Previously mapped area</span></div>
  </div>
  <ul class="chips">${Object.values(AREAS).map(a => `<li>${esc(a.name)}</li>`).join('')}</ul>`;
}

/* Real map (Leaflet + OpenStreetMap). If Leaflet cannot load, the schematic SVG above stays as a fallback. */
let LMAPS = [];
function initMaps(){
  LMAPS.forEach(m => { try { m.remove(); } catch(e){} });
  LMAPS = [];
  if (!window.L) return;
  const up = new Set(upcoming().map(e => e.area));
  document.querySelectorAll('.leafmap').forEach(el => {
    const fallback = el.innerHTML;
    try {
      const key = el.dataset.map;
      el.innerHTML = '';
      const map = L.map(el, { scrollWheelZoom:false });
      map.attributionControl.setPrefix(false);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19,
        attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors' }).addTo(map);
      const pts = [];
      const seq = key === 'upcoming' ? upcoming() : [];
      /* Course roles by date order: first = start triangle, last = finish (double circle), the rest numbered controls. */
      const nSeq = seq.length, roleOf = i => i === 0 ? 'start' : (i === nSeq - 1 ? 'finish' : 'ctl');
      const info = {};
      seq.forEach((e, i) => {
        const o = info[e.area] || (info[e.area] = { role: roleOf(i), nums: [] });
        if (roleOf(i) === 'ctl') o.nums.push(i);
      });
      let startRot = 0;
      if (nSeq > 1 && AREAS[seq[0].area] && AREAS[seq[1].area] && seq[0].area !== seq[1].area) {
        const A = AREAS[seq[0].area], B = AREAS[seq[1].area];
        const my = la => Math.log(Math.tan(Math.PI / 4 + la * Math.PI / 360));
        startRot = Math.atan2(B.lon - A.lon, (my(B.lat) - my(A.lat)) * 180 / Math.PI) * 180 / Math.PI;
      }
      const evKey = key.indexOf('event:') === 0 ? EVENTS.find(x => x.id === key.slice(6)) : null;
      const entries = evKey
        ? (AREAS[evKey.area] || evKey.loc ? [[evKey.area, Object.assign({}, AREAS[evKey.area] || { name:evKey.title, dx:14, dy:0, anchor:'start' }, evKey.loc ? { lat:evKey.loc.lat, lon:evKey.loc.lon } : {})]] : [])
        : Object.entries(AREAS).filter(([k]) => key === 'all' || (key === 'upcoming' ? up.has(k) : k === key));
      entries.forEach(([k, a]) => {
        if (isNaN(a.lat) || isNaN(a.lon)) return;
        let icon;
        if (key === 'upcoming' && info[k]) {
          const o = info[k], num = o.nums.length ? '<span class="num">' + o.nums.join(', ') + '</span>' : '';
          const shape = o.role === 'start'
            ? '<svg class="tri" viewBox="0 0 30 30" style="transform:rotate(' + startRot.toFixed(1) + 'deg);transform-origin:15px 17px"><polygon points="15,2.5 28,25.5 2,25.5" fill="none" stroke="#A3238E" stroke-width="3.5" stroke-linejoin="miter"/></svg>'
            : o.role === 'finish'
              ? '<span class="fin"></span><span class="fin2"></span>'
              : '<span class="ring"></span>';
          icon = L.divIcon({ className:'', html:'<div class="ctl">' + shape + num + '</div>', iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-18] });
        } else if (up.has(k)) {
          icon = L.divIcon({ className:'', html:'<div class="ctl"><span class="ring"></span></div>', iconSize:[30,30], iconAnchor:[15,15], popupAnchor:[0,-16] });
        } else {
          icon = L.divIcon({ className:'', html:'<span class="lpin"></span>', iconSize:[22,22], iconAnchor:[11,11], popupAnchor:[0,-12] });
        }
        const evs = EVENTS.filter(e => e.area === k && (key !== 'upcoming' || !isPast(e))).sort((x, y) => parseDate(y.date) - parseDate(x.date));
        const list = evs.map(e => {
          const label = esc(e.title) + ' (' + fmtShort.format(parseDate(e.date)) + ')';
          return '<br>' + (e.detail ? '<a href="#event-' + esc(e.id) + '">' + label + '</a>' : label);
        }).join('');
        L.marker([a.lat, a.lon], { icon:icon, title:a.name }).addTo(map).bindPopup('<strong>' + esc(a.name) + '</strong>' + list);
        pts.push([a.lat, a.lon]);
      });
      if (key !== 'all' && key !== 'upcoming' && pts.length) map.setView(pts[0], evKey && evKey.loc ? 16 : 14);
      else if (pts.length) map.fitBounds(pts, { padding:[40,40], maxZoom:key === 'upcoming' ? 12 : 11 });
      else map.setView([52.2, 1.0], 9);
      if (key === 'upcoming' && seq.length > 1) {
        /* Course legs: a plain SVG overlay on the map, redrawn whenever the map moves or zooms.
           Lines stop short of each circle, like the legs of an orienteering course. */
        const NS = 'http://www.w3.org/2000/svg', R = 18;
        const svg = document.createElementNS(NS, 'svg');
        svg.setAttribute('class', 'legs');
        svg.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:450;overflow:visible';
        el.appendChild(svg);
        const drawLegs = () => {
          let n = 0, html = '';
          for (let i = 0; i < seq.length - 1; i++) {
            const A = AREAS[seq[i].area], B = AREAS[seq[i + 1].area];
            if (!A || !B || seq[i].area === seq[i + 1].area) continue;
            const p = map.latLngToContainerPoint([A.lat, A.lon]), q = map.latLngToContainerPoint([B.lat, B.lon]);
            const dx = q.x - p.x, dy = q.y - p.y, d = Math.sqrt(dx * dx + dy * dy);
            if (!(d > 2 * R + 2)) continue;
            const ux = dx / d, uy = dy / d;
            html += '<line x1="' + (p.x + ux * R).toFixed(1) + '" y1="' + (p.y + uy * R).toFixed(1) + '" x2="' + (q.x - ux * R).toFixed(1) + '" y2="' + (q.y - uy * R).toFixed(1) + '" stroke="#A3238E" stroke-width="3" stroke-linecap="round"/>';
            n++;
          }
          svg.innerHTML = html;
          el.dataset.legs = n;
          const st = document.getElementById('status');
          if (st) st.textContent = st.textContent.replace(/ \| legs: \d+/, '') + ' | legs: ' + n;
        };
        map.on('move zoom moveend zoomend resize', drawLegs);
        drawLegs();
        setTimeout(drawLegs, 300);
      }
      LMAPS.push(map);
    } catch (err) { el.innerHTML = fallback; }
  });
}

        <article class="card"><h3>MapRun</h3><p style="margin-top:.5rem">Use the MapRun app on your phone to find virtual controls and get timed, wherever you are.</p></article>

      <section class="section"><div class="empty"><strong>Next step:</strong> a map of every permanent and MapRun course, each with its location, difficulty and map download. This is a placeholder for it.</div></section>
    </div>`;
  },
  club(){
    return `${pageHead('Club', 'Everything about SUFFOC in one place.')}
    <div class="wrap"><section class="section"><div class="tiles">
      ${CLUB.map(c => `<a class="tile" href="#club-${c.id}"><h3>${esc(c.title)}</h3><p>${esc(c.desc)}</p></a>`).join('')}
    </div></section></div>`;
  },
  newcomers(){
    return `${pageHead('New to orienteering?', 'A quick guide to getting started.')}
    <div class="wrap"><section class="section">
      <ol class="steps">
        <li><h3>What is orienteering?</h3><p style="margin-top:.4rem">Navigating between marked points on a detailed map, choosing your own route. You can run, jog or walk.</p></li>
        <li><h3>Where does it take place?</h3><p style="margin-top:.4rem">Forests, heaths, parks and town centres, across Suffolk and beyond.</p></li>
        <li><h3>Getting ready</h3><p style="margin-top:.4rem">Wear what you would wear for a walk or run outdoors. Shoes with some grip help, and trousers are a good idea in woodland.</p></li>
        <li><h3>Your first event</h3><p style="margin-top:.4rem">Arrive, register, and pick a colour-coded course. Beginners usually start with White or Yellow. Ask anyone for help.</p></li>
        <li><h3>Taking it further</h3><p style="margin-top:.4rem">Try the Anytime courses, come to more events, or join the club.</p></li>
      </ol>
      <div class="btns" style="margin:1.4rem 0"><a class="btn gold" href="#club-membership">Join SUFFOC</a><a class="btn line" href="#events">See upcoming events</a></div>
      <p class="note">Prototype copy. The real wording from the current site moves here.</p>
    </section></div>`;
  }
};

function timingsRows(e){
  const t = tm(e);
  return [['Registration', rng(t.regFrom, t.regTo)], ['Starts', rng(t.startsFrom, t.startsTo)], ['Course closes', t.close]].filter(r => r[1]);
}
function eventPage(id){
  const e = EVENTS.find(x => x.id === id && x.detail);
  if (!e) return VIEWS.events();
  const d = e.detail, area = AREAS[e.area] || null, date = parseDate(e.date);
  const loc = e.loc || (area && isFinite(area.lat) && isFinite(area.lon) ? area : null), q = loc ? loc.lat + ',' + loc.lon : '';
  const facts = [['Date', fmtLong.format(date)], ['Area', area ? area.name : e.area]].filter(f => f[1]);
  const docs = [];
  if (e.pdf) docs.push(['Preliminary details (PDF)', e.pdf]);
  (d.docs || []).forEach(x => docs.push(x));
  return `<section class="pagehead"><div class="wrap">
      <a class="back" href="#events">&larr; Back to Events</a><br>
      <span class="pill">${esc(e.type || 'Event')}</span>
      <h1 class="event-title">${esc(e.title)}</h1>
      <p class="lead">${esc(fmtLong.format(date))}${timeRange(e) ? ' &middot; ' + esc(timeRange(e)) : ''}</p>
    </div></section>
    <div class="wrap"><div class="detail-grid">
      <aside class="stack">
        ${e.entryUrl && !isPast(e) ? `<div class="card entrycard"><a class="btn big gold" href="${esc(e.entryUrl)}" ${ext}>Enter online</a>${e.entryNote ? `<p class="note-line">${esc(e.entryNote)}</p>` : ''}</div>` : ''}
        <div class="card"><h3>Key facts</h3>
          <dl class="facts">${facts.map(f => `<dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd>`).join('')}</dl></div>
        ${timingsRows(e).length ? `<div class="card"><h3>Timings</h3>
          <dl class="facts">${timingsRows(e).map(r => `<dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd>`).join('')}</dl></div>` : ''}
        ${d.officials.length ? `<div class="card"><h3>Event Officials</h3>
          <dl class="facts">${d.officials.map(o => `<dt>${esc(o[0])}</dt><dd>${esc(o[1])}</dd>`).join('')}</dl></div>` : ''}
        ${docs.length ? `<div class="card"><h3>Documents and links</h3>
          <div class="links" style="margin-top:.8rem">${docs.map(x => `<a class="btn small line" href="${esc(x[1])}" ${ext}>${esc(x[0])}</a>`).join('')}</div></div>` : ''}
      </aside>
      <div class="stack">
        ${e.results && e.results.length ? `<section class="card"><h3>Results</h3><div class="links" style="margin-top:.8rem">${e.results.map(l => `<a class="btn small gold" href="${esc(l[1])}" ${ext}>${esc(l[0])}</a>`).join('')}</div></section>`
          : (isPast(e) ? `<section class="card todo"><h3>Results</h3><p style="margin:.6rem 0 0">Results to follow.</p></section>` : '')}
        ${d.about ? `<section class="card"><h3>About the area</h3><p style="margin-top:.6rem">${esc(d.about)}</p></section>` : ''}
        ${(loc || d.address.length || d.postcode || d.gridRef || d.w3w) ? `<section class="card"><h3>Event Location</h3>
          ${(d.address.length || d.postcode) ? `<p style="margin:.6rem 0">${[...d.address.map(esc), esc(d.postcode)].filter(Boolean).join('<br>')}</p>` : ''}
          <dl class="facts" style="margin-bottom:1rem">
            ${d.gridRef ? `<dt>Grid reference</dt><dd class="code">${esc(d.gridRef)}</dd>` : ''}
            ${d.w3w ? `<dt>what3words</dt><dd class="code"><a href="https://what3words.com/${encodeURIComponent(d.w3w)}" ${ext}>///${esc(d.w3w)}</a></dd>` : ''}
          </dl>
          <div class="links" style="margin-bottom:1rem">
            ${loc ? `<a class="btn small gold" href="https://www.google.com/maps/search/?api=1&query=${q}" ${ext}>Open in Google Maps</a>
            <a class="btn small line" href="https://www.openstreetmap.org/?mlat=${loc.lat}&mlon=${loc.lon}#map=16/${loc.lat}/${loc.lon}" ${ext}>OpenStreetMap</a>` : ''}
          </div>
          ${loc ? `<div class="map"><div class="leafmap single" data-map="event:${esc(e.id)}">${mapSVG(e.area)}${FALLBACK_NOTE}</div></div>` : ''}
        </section>` : ''}
        <section class="card todo"><h3>Courses, fees and entry</h3>
          <p style="margin:.6rem 0 0">To add: courses and lengths, entry fees, how to enter, start times and parking. These come from the preliminary details once confirmed.</p></section>
      </div>
    </div></div>`;
}

function clubPage(id){
  const c = CLUB.find(x => x.id === id) || (id === 'contact' ? { title:'Contact', desc:'' } : null);
  if (!c) return VIEWS.club();
  const extra = id === 'agm' ? ' The link to the Google Drive folder goes here.' : '';
  return `${pageHead(c.title)}
  <div class="wrap"><section class="section">
    <a class="back" href="#club">&larr; Back to Club</a>
    <div class="empty">This page is a placeholder. The content from the current site moves here.${extra}</div>
  </section></div>`;
}

/* Routing: one page, plain #name hashes. */
const view = document.getElementById('view');
const nav = document.getElementById('nav');
const menuBtn = document.getElementById('menuBtn');
function route(){
  const h = (location.hash || '#home').slice(1);
  let key = 'home', html;
  if (h.startsWith('club-')) { key = 'club'; html = clubPage(h.slice(5)); }
  else if (h.startsWith('event-')) { key = 'events'; html = eventPage(h.slice(6)); }
  else if (VIEWS[h]) { key = h === 'mapped' ? 'events' : h; html = VIEWS[h](); }
  else { html = VIEWS.home(); }
  view.innerHTML = html;
  initMaps();
  document.querySelectorAll('.nav a[data-route]').forEach(a => {
    if (a.dataset.route === key) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  nav.classList.remove('open'); menuBtn.setAttribute('aria-expanded', 'false');
  window.scrollTo(0, 0);
}
menuBtn.addEventListener('click', () => {
  const open = nav.classList.toggle('open');
  menuBtn.setAttribute('aria-expanded', String(open));
});
window.addEventListener('hashchange', route);
status('loading data...');
Promise.all([
  fetch('data/areas.json', { cache:'no-cache' }).then(r => { if(!r.ok) throw new Error('areas.json HTTP ' + r.status); return r.json(); }),
  fetch('data/events.json', { cache:'no-cache' }).then(r => { if(!r.ok) throw new Error('events.json HTTP ' + r.status); return r.json(); })
]).then(([a, e]) => { loadData(asList(a), asList(e)); route(); status('loaded ' + EVENTS.length + ' events, ' + Object.keys(AREAS).length + ' areas' + (SKIPPED.length ? '. SKIPPED (needs a Date as YYYY-MM-DD): ' + SKIPPED.join('; ') : '')); })
  .catch(err => { status('FAILED: ' + err.message); view.innerHTML = '<div class="wrap"><div class="empty">Could not load the event data: ' + esc(err.message) + '</div></div>'; });
</script>
</body>
</html>
