media:
  input: images
  output: /images
content:
- name: events
  label: Events and results
  type: collection
  path: data/events
  format: json
  filename:
    template: '{primary}.json'
    field: create
  view:
    fields: [date, title, type, area]
    primary: title
    sort: [date, title]
    search: [title, area]
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Event name
    type: string
    required: true
  - name: date
    label: Date
    type: date
    options:
      format: yyyy-MM-dd
    required: true
  - name: type
    label: Event type
    type: select
    options:
      values:
      - Regional
      - Local event
      - Street-O
      - Score event
      - Training
      - Other
  - name: area
    label: Area
    type: reference
    description: Pick from the Mapped areas list. If the place isn't there yet, add it under Mapped areas first.
    required: true
    options:
      collection: areas
      search: name
      label: '{primary}'
      value: '{primary}'
  - name: entry
    label: ENTRY
    type: object
    description: Adds the big gold Enter online button, at the top of the event page.
    fields:
    - name: url
      label: Enter online link
      type: string
      description: The full web address of the entry page, e.g. the RaceSignup link.
    - name: note
      label: Entry note
      type: string
      description: Short line under the button, e.g. Entries close Friday 27 November
  - name: timings
    label: TIMINGS
    type: object
    description: Fill in what you know. The first Starts time and the last Course closes time are shown on the home page and Events page.
    fields:
    - name: registrationFrom
      label: Registration opens
      type: string
      description: e.g. 10:00
    - name: registrationTo
      label: Registration closes
      type: string
      description: e.g. 11:30
    - name: startsFrom
      label: Starts open
      type: string
      description: First start time, e.g. 10:30
    - name: startsTo
      label: Starts close
      type: string
      description: Last start time, e.g. 12:00
    - name: courseClose
      label: Course closes
      type: string
      description: Final course close time, e.g. 14:00
  - name: officials
    label: EVENT OFFICIALS
    type: object
    description: Pick from Club members. If someone isn't there yet, add them under Club members first, or use Other officials.
    fields:
      - name: organiser
        label: Organiser
        type: reference
        options:
          collection: members
          search: name
          label: '{primary}'
          value: '{primary}'
      - name: planner
        label: Planner
        type: reference
        options:
          collection: members
          search: name
          label: '{primary}'
          value: '{primary}'
      - name: controller
        label: Controller
        type: reference
        options:
          collection: members
          search: name
          label: '{primary}'
          value: '{primary}'
      - name: others
        label: Other officials (optional)
        type: object
        list: true
        description: For helpers who aren't club members, e.g. a controller from another club.
        fields:
        - name: role
          label: Role
          type: string
        - name: name
          label: Name
          type: string
  - name: location
    label: EVENT LOCATION
    type: object
    description: Filling in anything here creates the full event page.
    fields:
    - name: address
      label: Address lines
      type: string
      list: true
    - name: postcode
      label: Postcode
      type: string
    - name: gridRef
      label: Grid reference (OS)
      type: string
      description: e.g. TM 39950 52750. Places the pin on this event's map and the Google Maps link.
    - name: w3w
      label: what3words (no ///)
      type: string
      description: e.g. only.pint.form. Shown as text and a link only, it does not move the map pin.
  - name: about
    label: ABOUT THE AREA
    type: text
  - name: documents
    label: DOCUMENTS AND LINKS
    type: object
    fields:
    - name: pdf
      label: Preliminary details PDF link
      type: string
    - name: oldPage
      label: Link to existing event page
      type: string
    - name: docs
      label: Other documents and links
      type: object
      list: true
      fields:
      - name: label
        label: Link text
        type: string
      - name: url
        label: Web address
        type: string
  - name: resultLinks
    label: RESULTS (add after the event)
    type: object
    description: Paste the web address for each one you have. Leave the others blank.
    fields:
    - name: results
      label: Results and split times
      type: string
    - name: winsplits
      label: Winsplits
      type: string
    - name: routegadget
      label: Routegadget
      type: string
    - name: comments
      label: Comments
      type: string
    - name: other
      label: Other result links (optional)
      type: object
      list: true
      description: Only for extra links that don't fit above, e.g. a second Routegadget map.
      fields:
      - name: label
        label: Link text
        type: string
      - name: url
        label: Web address
        type: string
- name: areas
  label: Mapped areas
  type: collection
  path: data/areas
  format: json
  filename: '{primary}.json'
  view:
    primary: name
    fields: [name]
  fields:
  - name: name
    label: Name
    type: string
    required: true
  - name: gridRef
    label: Grid reference (OS)
    type: string
    description: e.g. TM 39950 52750. The map pin is placed from this, so you don't need latitude and longitude.
  - name: lat
    label: Latitude (optional)
    type: number
    description: Only needed if there is no grid reference.
  - name: lon
    label: Longitude (optional)
    type: number
    description: Only needed if there is no grid reference.
  - name: label_dx
    label: Map label shift across
    type: number
  - name: label_dy
    label: Map label shift down
    type: number
  - name: label_anchor
    label: Map label side
    type: select
    options:
      values:
      - start
      - middle
      - end
- name: members
  label: Club members
  type: collection
  path: data/members
  format: json
  filename: '{primary}.json'
  view:
    primary: name
    fields: [name, role]
  fields:
  - name: name
    label: Name
    type: string
    required: true
  - name: role
    label: Club role (optional)
    type: string
    description: e.g. Chair, Treasurer, Fixtures Secretary.
  - name: email
    label: Email (optional)
    type: string
    description: Only add this if the person is happy for it to be public. A role address such as chair@ is usually better than a personal one.
  - name: photo
    label: Photo (optional)
    type: image
    description: Only add this if the person is happy for it to be public.
  - name: committee
    label: Show on the committee page
    type: boolean
- name: news
  label: News
  type: file
  path: data/news.json
  format: json
  fields:
  - name: news
    label: News items
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{date} {title}'
    fields:
    - name: title
      label: Headline
      type: string
    - name: date
      label: Date
      type: date
      options:
        format: yyyy-MM-dd
    - name: image
      label: Picture (optional)
      type: image
    - name: imageAlt
      label: Picture description (optional)
      type: string
      description: A few words describing the picture, for people using screen readers.
    - name: text
      label: Main text
      type: rich-text
      description: The full article. The cards on the home and News pages show the first few words, with Read more taking people to the full article.
      options:
        format: html
    - name: link
      label: Link to old news page (optional)
      type: string
      description: Only if the article also exists on the old website.
