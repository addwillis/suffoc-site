          # END members
      - name: others
        label: Other officials (optional)
        type: object
        list: true
        description: For helpers who aren't club members, e.g. a controller from another club.
        fields:
        - name: role
          label: Role
          type: string
        - name: name
          label: Name
          type: string
  - name: documents
    label: DOCUMENTS AND LINKS
    type: object
    fields:
    - name: pdf
      label: Preliminary details PDF link
      type: string
    - name: britishOrienteering
      label: British Orienteering event page link
      type: string
      description: The event's page on britishorienteering.org.uk
    - name: oldPage
      label: Link to existing event page
      type: string
    - name: docs
      label: Other documents and links
      type: object
      list: true
      fields:
      - name: label
        label: Link text
        type: string
      - name: url
        label: Web address
        type: string
  - name: resultLinks
    label: RESULTS (add after the event)
    type: object
    description: Paste the web address for each one you have. Leave the others blank.
    fields:
    - name: results
      label: Results and split times
      type: string
    - name: winsplits
      label: Winsplits
      type: string
    - name: routegadget
      label: Routegadget
      type: string
    - name: other
      label: Other result links (optional)
      type: object
      list: true
      description: Only for extra links that don't fit above, e.g. a second Routegadget map.
      fields:
      - name: label
        label: Link text
        type: string
      - name: url
        label: Web address
        type: string
  - name: comments
    label: EVENT COMMENTS (add after the event)
    type: object
    description: Comments from the people who ran the event. Leave empty if you haven't been sent any. A Comments button appears next to the results once any of these have text.
    fields:
    - name: planner
      label: Planner's comments
      type: rich-text
      options:
        format: html
    - name: organiser
      label: Organiser's comments
      type: rich-text
      options:
        format: html
    - name: controller
      label: Controller's comments
      type: rich-text
      options:
        format: html
- name: levels
  label: Event levels
  type: collection
  path: data/levels
  format: json
  filename: '{primary}.json'
  view:
    primary: name
    fields: [name, order]
  fields:
  - name: name
    label: Name
    type: string
    required: true
  - name: order
    label: Order in the dropdown
    type: number
    description: 1 comes first. National 1, Regional 2, Local 3.
- name: series
  label: Event series
  type: collection
  path: data/series
  format: json
  filename: '{primary}.json'
  view:
    primary: name
    fields: [name]
  fields:
  - name: name
    label: Name
    type: string
    required: true
- name: clubs
  label: Other clubs
  type: collection
  path: data/clubs
  format: json
  filename: '{primary}.json'
  view:
    primary: name
    fields: [name, fullName]
  fields:
  - name: name
    label: Short name
    type: string
    required: true
    description: The short name used on the site, for example NOR or WAOC.
  - name: fullName
    label: Full name
    type: string
    description: For example Norfolk Orienteering Club.
  - name: website
    label: Website
    type: string
    description: The full web address, starting https://
  - name: notes
    label: About the club (optional)
    type: text
    description: A line or two, for example where they usually run.
- name: towns
  label: Towns and regions
  type: collection
  path: data/towns
  format: json
  filename: '{primary}.json'
  view:
    primary: name
    fields: [name]
  fields:
  - name: name
    label: Name
    type: string
    required: true
    description: A town or region that groups mapped areas, for example Ipswich or Bury St Edmunds.
- name: areas
  label: Mapped areas
  type: collection
  path: data/areas
  format: json
  filename: '{primary}.json'
  view:
    primary: name
    fields: [name]
  fields:
  - name: name
    label: Name
    type: string
    required: true
  - name: town
    label: Town or region
    type: select
    description: Groups this area with others on the Mapped areas page. If it isn't listed, add it under Towns and regions first. Optional.
    options:
      values:
      # BEGIN towns
      - "Bury St Edmunds"
      - "Ipswich"
      # END towns
  - name: mapType
    label: Map type
    type: select
    description: SUFFOC map means an orienteering map our mapping officer surveyed and checked. OpenStreetMap means public OpenStreetMap data, like the MapRun nights. Other club's map is for areas we only post results for, like national events elsewhere. Those are left off the Mapped areas page. Leave empty for SUFFOC map.
    options:
      values:
      - "SUFFOC map"
      - "OpenStreetMap"
      - "Other club's map"
  - name: gridRef
    label: Grid reference (OS)
    type: string
    description: e.g. TM 39950 52750. The map pin is placed from this, so you don't need latitude and longitude.
  - name: lat
    label: Latitude (optional)
    type: number
    description: Only needed if there is no grid reference.
  - name: lon
    label: Longitude (optional)
    type: number
    description: Only needed if there is no grid reference.
- name: permanent
  label: Permanent orienteering courses
  type: collection
  path: data/permanent
  format: json
  filename: '{primary}.json'
  view:
    primary: name
    fields: [name, area]
    search: [name, area]
  fields:
  - name: name
    label: Name
    type: string
    required: true
  - name: area
    label: Mapped area (optional)
    type: select
    description: Pick from the Mapped areas list if the course is in one of the areas the club has mapped.
    options:
      values:
      # BEGIN areas
      - "Alton Water"
      - "Barnham Cross Common"
      - "Beccles Common"
      - "Belstead Brook"
      - "Bourne Park"
      - "Bramford"
      - "Brandon Country Park"
      - "Broom Hill and The Dales"
      - "Bury St Edmunds"
      - "Chantry Park"
      - "Christchurch Park"
      - "Clare"
      - "Claydon"
      - "Combs Ford"
      - "Culford School"
      - "Elmswell"
      - "Eye"
      - "Finborough"
      - "Foxhall Woods"
      - "Gunton Denes and Dip Farm"
      - "Hardwick Heath"
      - "Haughley Park"
      - "Haverhill"
      - "Holywells and Landseer Parks"
      - "Ickworth Park"
      - "Ipswich High School"
      - "Kesgrave"
      - "King's Forest"
      - "Knettishall Heath"
      - "Martlesham Heath"
      - "Moreton Hall"
      - "Needham Market"
      - "Nowton Park"
      - "Sudbury"
      - "Tunstall Forest"
      # END areas
  - name: description
    label: ABOUT THE COURSE
    type: rich-text
    options:
      format: html
    description: A short description of what the course is like and who it suits.
  - name: courses
    label: COURSES
    type: object
    list: true
    description: One entry per course, e.g. Orange, 3.0 km, 14 controls.
    fields:
    - name: name
      label: Course name
      type: string
      description: e.g. Orange, Short Green, Course 1
    - name: colour
      label: Colour dot (optional)
      type: select
      description: Only needed if the name isn't already a colour.
      options:
        values:
        - White
        - Yellow
        - Orange
        - Light Green
        - Short Green
        - Green
        - Blue
        - Brown
        - Black
    - name: length
      label: Length (km)
      type: string
    - name: controls
      label: Number of controls
      type: string
    - name: climb
      label: Climb (m, optional)
      type: string
    - name: note
      label: Note (optional)
      type: string
  - name: mapUrl
    label: Map download link
    type: string
    description: The web address of the map PDF (or the page it is on).
  - name: mapNote
    label: Map note (optional)
    type: string
    description: Short line under the download button, e.g. Print at A4. Last updated March 2025.
  - name: gridRef
    label: Start grid reference (OS)
    type: string
    description: e.g. TM 39950 52750. The map pin is placed from this.
  - name: lat
    label: Latitude (optional)
    type: number
    description: Only needed if there is no grid reference.
  - name: lon
    label: Longitude (optional)
    type: number
    description: Only needed if there is no grid reference.
  - name: postcode
    label: Postcode (optional)
    type: string
  - name: w3w
    label: what3words (optional)
    type: string
    description: e.g. only.pint.form
  - name: notes
    label: GETTING THERE AND NOTES
    type: rich-text
    options:
      format: html
    description: Parking, access, dogs, anything people should know.
- name: members
  label: Club members
  type: collection
  path: data/members
  format: json
  filename: '{primary}.json'
  view:
    primary: name
    fields: [name, roles]
  fields:
  - name: name
    label: Name
    type: string
    required: true
  - name: roles
    label: Club roles (optional, up to 4)
    type: object
    list:
      max: 4
    description: Anyone with a role is shown on the Committee page. Each role has its own email address.
    fields:
    - name: role
      label: Role
      type: string
      description: e.g. Chair, Treasurer, Fixtures Secretary.
    - name: email
      label: Email for this role
      type: string
      description: e.g. chair@suffoc.co.uk. Only add it if it's happy to be public.
  - name: photo
    label: Photo (optional)
    type: image
    description: Only add this if the person is happy for it to be public.
- name: pagetext
  label: Page text
  type: file
  path: data/pagetext.json
  format: json
  fields:
  - name: events
    label: EVENTS PAGE
    type: object
