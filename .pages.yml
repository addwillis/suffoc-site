            format: html
      - name: documents
        label: DOCUMENTS AND LINKS
        type: object
        fields:
        - name: pdf
          label: Preliminary details PDF link
          type: string
        - name: britishOrienteering
          label: British Orienteering event page link
          type: string
          description: The event's page on britishorienteering.org.uk
