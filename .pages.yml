media:
- name: images
  input: images
  output: /images
- name: documents
  input: documents
  output: /documents
  extensions: [pdf, doc, docx]
content:
- name: events
  label: Events and results
  type: collection
  path: data/events
  format: json
  filename: '{primary}.json'
  view:
    fields: [date, title, level, series, area]
    primary: title
    sort: [date, title]
    search: [title, area]
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Event name
    type: string
    required: true
  - name: date
    label: Date
    type: date
    options:
      format: yyyy-MM-dd
    required: true
  - name: level
    label: Event level
    type: select
    description: National, Regional or Local. To change the list, use Event levels in the menu.
    options:
      values:
      # BEGIN levels
      - "National"
      - "Regional"
      - "Local"
      # END levels
  - name: series
    label: Event series
    type: select
    description: Optional. Pick from the Event series list, e.g. Mid-Week Street-O.
    options:
      values:
      # BEGIN series
      - "Compass Sport Heat"
      - "Mid-Week Street-O"
      - "Simon Peck Summer Series"
      # END series
  - name: league
    label: Counts for the club league
    type: boolean
    description: Tick if this event is part of the club league. It then appears on the League page and the home page reminder.
  - name: area
    label: Area
    type: select
    description: Optional. Pick from the Mapped areas list. If the place isn't there yet, add it under Mapped areas first. Leave empty if the event has no area.
    options:
      values:
      # BEGIN areas
      - "Alton Water"
      - "Barnham Cross Common"
      - "Beccles Common"
      - "Belstead Brook"
      - "Bourne Park"
      - "Bramford"
      - "Brandon Country Park"
      - "Broom Hill and The Dales"
      - "Bury St Edmunds"
      - "Chantry Park"
      - "Christchurch Park"
      - "Clare"
      - "Claydon"
      - "Combs Ford"
      - "Culford School"
      - "Elmswell"
      - "Eye"
      - "Finborough"
      - "Foxhall Woods"
      - "Gunton Denes and Dip Farm"
      - "Hardwick Heath"
      - "Haughley Park"
      - "Haverhill"
      - "Holywells and Landseer Parks"
      - "Ickworth Park"
      - "Ipswich High School"
      - "Kesgrave"
      - "King's Forest"
      - "Knettishall Heath"
      - "Martlesham Heath"
      - "Moreton Hall"
      - "Needham Market"
      - "Nowton Park"
      - "Sudbury"
      - "Tunstall Forest"
      # END areas
  - name: about
    label: EVENT OVERVIEW
    type: rich-text
    options:
      format: html
    description: A short summary of the event, e.g. what to expect, the terrain and who it suits.
  - name: location
    label: EVENT LOCATION
    type: object
    description: Filling in anything here creates the full event page.
    fields:
    - name: address
      label: Address lines
      type: string
      list: true
    - name: postcode
      label: Postcode
      type: string
    - name: gridRef
      label: Grid reference (OS)
      type: string
      description: e.g. TM 39950 52750. Places the pin on this event's map and the Google Maps link.
    - name: w3w
      label: what3words (no ///)
      type: string
      description: e.g. only.pint.form. Shown as text and a link only, it does not move the map pin.
  - name: courses
    label: COURSES
    type: object
    list: true
    description: Add one entry per course. Leave empty until the courses are confirmed.
    fields:
    - name: name
      label: Course name
      type: string
      description: e.g. Green, Short Green, Course 1, Short, Medium, Long
    - name: colour
      label: Colour dot (optional)
      type: select
      description: Only needed if the name isn't already a colour, e.g. a coloured Short course.
      options:
        values:
        - White
        - Yellow
        - Orange
        - Light Green
        - Short Green
        - Green
        - Blue
        - Brown
        - Black
    - name: length
      label: Length (km)
      type: string
      description: e.g. 3.2
    - name: controls
      label: Number of controls
      type: string
    - name: climb
      label: Climb (m, optional)
      type: string
    - name: note
      label: Note (optional)
      type: string
      description: e.g. Good for beginners
  - name: fees
    label: ENTRY FEES
    type: object
    description: Leave empty until the fees are confirmed. Prices can be typed as 8 or £8.
    fields:
    - name: entryUrl
      label: Enter online link
      type: string
      description: The full web address of the entry page, e.g. the RaceSignup link. Adds the gold Enter online button.
    - name: entryNote
      label: Entry note (optional)
      type: string
      description: Short line under the Enter online button.
    - name: rows
      label: Prices
      type: object
      list: true
      description: One row per type of entrant, e.g. Senior member, Senior non-member, Junior.
      fields:
      - name: category
        label: Who
        type: string
      - name: early
        label: Standard price
        type: string
      - name: late
        label: Late / on the day price
        type: string
    - name: earlyDeadline
      label: Standard price online entry closes (optional)
      type: string
      description: Type as 2026-11-22, or in words like 22 November. Online entries up to this date get the standard price. Leave empty if not needed.
    - name: lateDeadline
      label: Late online entry closes (optional)
      type: string
      description: Type as 2026-11-22, or in words like 22 November. Late online entries are taken up to this date. Leave empty if not needed.
    - name: chipHire
      label: Chip hire
      type: string
      default: "£1"
    - name: siacHire
      label: SIAC chip hire
      type: string
      default: "£3"
    - name: note
      label: Note (optional)
      type: text
      description: e.g. Cash or card on the day. Group discounts.
  - name: timings
    label: EVENT TIMES
    type: object
    description: Fill in what you know. The first Starts time and the last Course closes time are shown on the home page and Events page.
    fields:
    - name: registrationFrom
      label: Registration opens
      type: string
      description: e.g. 10:00
    - name: registrationTo
      label: Registration closes
      type: string
      description: e.g. 11:30
    - name: startsFrom
      label: Starts open
      type: string
      description: First start time, e.g. 10:30
    - name: startsTo
      label: Starts close
      type: string
      description: Last start time, e.g. 12:00
    - name: courseClose
      label: Course closes
      type: string
      description: Final course close time, e.g. 14:00
  - name: officials
    label: EVENT OFFICIALS
    type: object
    description: Pick from Club members. If someone isn't there yet, add them under Club members first, or use Other officials.
    fields:
      - name: organiser
        label: Organiser
        type: select
        options:
          values:
          # BEGIN members
          - "Adam Willis"
          - "Andrew Elliott"
          - "Clive Wilkinson"
          - "David Hodkinson"
          - "Ethan Radcliffe"
          - "Gareth Radcliffe"
          - "Hannah Constable-Simmonds"
          - "John Liston"
          - "Louise Walker"
          - "Martin Hore"
          - "Mike Bickle"
          - "Paul Beckett"
          - "Phil Halford"
          - "Rod Mansel"
          - "Sally Wilkinson"
          - "Sarah Mansel"
          - "Simon Hooton"
          - "Will Harrison"
          # END members
      - name: planner
        label: Planner
        type: select
        options:
          values:
          # BEGIN members
          - "Adam Willis"
          - "Andrew Elliott"
          - "Clive Wilkinson"
          - "David Hodkinson"
          - "Ethan Radcliffe"
          - "Gareth Radcliffe"
          - "Hannah Constable-Simmonds"
          - "John Liston"
          - "Louise Walker"
          - "Martin Hore"
          - "Mike Bickle"
          - "Paul Beckett"
          - "Phil Halford"
          - "Rod Mansel"
          - "Sally Wilkinson"
          - "Sarah Mansel"
          - "Simon Hooton"
          - "Will Harrison"
          # END members
      - name: controller
        label: Controller
        type: select
        options:
          values:
          # BEGIN members
          - "Adam Willis"
          - "Andrew Elliott"
          - "Clive Wilkinson"
          - "David Hodkinson"
          - "Ethan Radcliffe"
          - "Gareth Radcliffe"
          - "Hannah Constable-Simmonds"
          - "John Liston"
          - "Louise Walker"
          - "Martin Hore"
          - "Mike Bickle"
          - "Paul Beckett"
          - "Phil Halford"
          - "Rod Mansel"
          - "Sally Wilkinson"
          - "Sarah Mansel"
          - "Simon Hooton"
          - "Will Harrison"
          # END members
      - name: riskAssessor
        label: Risk Assessor
        type: select
        options:
          values:
          # BEGIN members
          - "Adam Willis"
          - "Andrew Elliott"
          - "Clive Wilkinson"
          - "David Hodkinson"
          - "Ethan Radcliffe"
          - "Gareth Radcliffe"
          - "Hannah Constable-Simmonds"
          - "John Liston"
          - "Louise Walker"
          - "Martin Hore"
          - "Mike Bickle"
          - "Paul Beckett"
          - "Phil Halford"
          - "Rod Mansel"
          - "Sally Wilkinson"
