      - name: comments
        label: OFFICIALS' COMMENTS (add after the event)
        type: object
        description: Comments from the people who ran the event. Leave empty if you haven't been sent any. A Comments button appears next to the results once any of these have text.
        fields:
        - name: planner
          label: Planner's comments
          type: rich-text
          options:
            format: html
        - name: organiser
          label: Organiser's comments
          type: rich-text
          options:
            format: html
        - name: controller
          label: Controller's comments
          type: rich-text
