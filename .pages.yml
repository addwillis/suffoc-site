- name: agm
  label: AGM minutes
  type: file
  path: data/agm.json
  format: json
  fields:
  - name: minutes
    label: AGM minutes
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{date} {title}'
    fields:
    - name: date
      label: AGM date
      type: date
      options:
        format: yyyy-MM-dd
    - name: title
      label: Title (optional)
      type: string
      description: For example AGM 2025. If left empty the page shows AGM and the year.
    - name: file
      label: Minutes file
      type: file
      options:
        media: documents
      description: Upload the minutes as a PDF. These are public, so check there is nothing private in them.
    - name: note
      label: Note (optional)
      type: string
      description: A few words if needed, for example approved at the 2026 AGM.
- name: league
  label: Club league
  type: file
  path: data/league.json
  format: json
  fields:
  - name: rulesFile
    label: League rules (PDF upload)
    type: file
    options:
      media: documents
    description: Upload the rules as a PDF. Shows as a Rules button on the League page.
  - name: rulesUrl
    label: League rules link (instead of an upload)
    type: string
    description: Only if the rules are already online. An uploaded PDF above is used first.
  - name: tableUrl
    label: League table link
    type: string
    description: The web address of the current league table, for example a Google Sheets link. Shows as a League table button.
  - name: events
    label: Other clubs' league events
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{date} {title}'
    fields:
    - name: date
      label: Date
      type: date
      options:
        format: yyyy-MM-dd
    - name: title
      label: Event name
      type: string
    - name: level
      label: Event level
      type: select
      description: Optional. National, Regional or Local. To change the list, use Event levels in the menu.
      options:
        values:
        # BEGIN levels
        - "National"
        - "Regional"
        - "Local"
        # END levels
    - name: club
      label: Host club
      type: select
      description: Pick from Other clubs. If the club is not listed, add it first using Other clubs in the menu.
      options:
        values:
        # BEGIN clubs
        - "CHIG"
        - "HAVOC"
        - "NOR"
        - "SMOC"
        - "WAOC"
        # END clubs
    - name: startFrom
      label: Start times from (optional)
      type: string
      description: For example 10:30.
    - name: closes
      label: Courses close (optional)
      type: string
      description: For example 14:15.
    - name: link
      label: Link to enter or find out more
      type: string
      description: The full web address, usually the other club's event page or entry page.
    - name: note
      label: Note (optional)
      type: string
- name: championships
  label: Club championships
  type: file
  path: data/championships.json
  format: json
  fields:
  - name: rules
    label: Championship rules
    type: rich-text
    options:
      format: html
    description: Shown on the Club Championships page under Championship rules. Tables are supported.
  - name: championships
    label: Club championships
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{year} {event}'
    fields:
    - name: year
      label: Year
      type: string
      description: For example 2026.
    - name: event
      label: Event name
      type: string
    - name: date
      label: Date (optional)
      type: date
      options:
        format: yyyy-MM-dd
    - name: venue
      label: Venue (optional)
      type: string
    - name: club
      label: Host club (optional)
      type: select
      description: Pick from Other clubs if another club hosted it.
      options:
        values:
        # BEGIN clubs
        - "CHIG"
        - "HAVOC"
        - "NOR"
        - "SMOC"
        - "WAOC"
        # END clubs
    - name: eventLink
      label: Event page link (optional)
      type: string
      description: The full web address of the event, for example a SUFFOC event page.
    - name: resultsLink
      label: Results link (optional)
      type: string
      description: The full web address of the results.
    - name: resultsFile
      label: Results file (optional)
      type: file
      options:
        media: documents
      description: Upload the results as a PDF, if there is no online link.
    - name: note
      label: Note (optional)
      type: string
    - name: winners
      label: Winners
      type: object
      list: true
      fields:
      - name: class
        label: Class
        type: string
        description: For example Men, Women or M16.
      - name: member
        label: Club member
        type: select
        description: Pick the winner from Club members. They then get this win on their own page.
        options:
          values:
          # BEGIN members
          - "Adam Willis"
          - "Andrew Elliott"
          - "Clive Wilkinson"
          - "David Hodkinson"
          - "Ethan Radcliffe"
          - "Gareth Radcliffe"
          - "Hannah Constable-Simmonds"
          - "John Liston"
          - "Louise Walker"
          - "Martin Hore"
          - "Mike Bickle"
          - "Paul Beckett"
          - "Phil Halford"
          - "Rod Mansel"
          - "Sally Wilkinson"
          - "Sarah Mansel"
          - "Simon Hooton"
          - "Will Harrison"
          # END members
      - name: otherName
        label: Winner not in the members list
        type: string
        description: Only if the winner isn't in Club members, for example an earlier year. Leave empty when you pick a member above.
- name: news
  label: News
  type: file
  path: data/news.json
  format: json
  fields:
  - name: news
    label: News items
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{date} {title}'
    fields:
    - name: title
      label: Headline
      type: string
    - name: date
      label: Date
      type: date
      options:
        format: yyyy-MM-dd
    - name: image
      label: Picture (optional)
      type: image
    - name: imageAlt
      label: Picture description (optional)
      type: string
      description: A few words describing the picture, for people using screen readers.
    - name: text
      label: Main text
      type: rich-text
      description: The full article. The cards on the home and News pages show the first few words, with Read more taking people to the full article.
      options:
        format: html
    - name: link
      label: Link to old news page (optional)
      type: string
      description: Only if the article also exists on the old website.
