      - name: name
        label: Name
        type: string
        required: true
      - name: order
        label: Order in the dropdown
        type: number
        description: 1 comes first. National 1, Regional 2, Local 3.
    - name: series
      label: Event Series
      type: collection
      path: data/series
      format: json
      filename: '{primary}.json'
      view:
        primary: name
        fields: [name, abbreviation]
      fields:
      - name: name
        label: Name (in full)
        type: string
        required: true
        description: Use the full words, e.g. Compass Sport Heat.
      - name: abbreviation
        label: Abbreviation (optional)
        type: string
        description: e.g. CSH. Shown on the series page as "Also known as". Events that use the abbreviation still join the series.
      - name: description
        label: About this series (optional)
        type: rich-text
        options:
          format: html
- name: grp_places
  label: Areas
  type: group
  items:
    - name: areas
      label: Mapped Areas
      type: collection
      path: data/areas
      format: json
      filename: '{primary}.json'
      view:
        primary: name
        fields: [name]
      fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: town
        label: Town or region
        type: select
        description: Groups this area with others on the Mapped areas page. If it isn't listed, add it under Towns and regions first. Optional.
        options:
          values:
          # BEGIN towns
          - "Bury St Edmunds"
          - "Ipswich"
          # END towns
      - name: mapType
        label: Map type
        type: select
        description: SUFFOC map means an orienteering map our mapping officer surveyed and checked. OpenStreetMap means public OpenStreetMap data, like the MapRun nights. Other club's map is for areas we only post results for, like national events elsewhere. Those are left off the Mapped areas page. Leave empty for SUFFOC map.
        options:
          values:
          - "SUFFOC map"
          - "OpenStreetMap"
          - "Other club's map"
      - name: terrain
        label: Terrain (optional)
        type: select
        description: Pick everything that applies. Add or change the choices under Terrain types in the menu.
        options:
          multiple: true
          values:
          # BEGIN terrain
          - "Forest"
          - "Heath"
          - "Parkland"
          - "Urban"
          # END terrain
      - name: gridRef
        label: Grid reference (OS)
        type: string
        description: e.g. TM 39950 52750. The map pin is placed from this, so you don't need latitude and longitude.
      - name: lat
        label: Latitude (optional)
        type: number
        description: Only needed if there is no grid reference.
      - name: lon
        label: Longitude (optional)
        type: number
        description: Only needed if there is no grid reference.
    - name: towns
      label: Towns and Regions
      type: collection
      path: data/towns
      format: json
      filename: '{primary}.json'
      view:
        primary: name
        fields: [name]
      fields:
      - name: name
        label: Name
        type: string
        required: true
        description: A town or region that groups mapped areas, for example Ipswich or Bury St Edmunds.
    - name: terrain
      label: Terrain Types
      type: collection
      path: data/terrain
      format: json
      filename: '{primary}.json'
      view:
        primary: name
        fields: [name]
      fields:
      - name: name
        label: Name
        type: string
        required: true
- name: grp_news
  label: News
  type: group
  items:
    - name: news
      label: News
      type: collection
      path: data/news
      format: json
      filename: '{primary}.json'
      view:
        fields: [date, title]
        primary: title
        sort: [date, title]
        search: [title]
        default:
          sort: date
          order: desc
      fields:
      - name: title
        label: Headline
        type: string
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: image
        label: Picture (optional)
        type: image
        options:
          path: images/news
      - name: imageAlt
        label: Picture description (optional)
        type: string
        description: A few words describing the picture, for people using screen readers.
      - name: images
        label: More pictures (optional)
        type: image
        list: true
        description: Extra pictures shown under the text. Tap one to see it full size.
        options:
          path: images/news
      - name: text
        label: Main text
        type: rich-text
        description: The full article. The cards on the home and News pages show the first few words, with Read more taking people to the full article.
        options:
          format: html
      - name: link
        label: Link to old news page (optional)
        type: string
        description: Only if the article also exists on the old website.
- name: grp_anytime
  label: Anytime O
  type: group
  items:
    - name: permanent
      label: Permanent Orienteering Courses
      type: collection
      path: data/permanent
      format: json
      filename: '{primary}.json'
      view:
        primary: name
        fields: [name, area]
        search: [name, area]
      fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: area
        label: Mapped area (optional)
        type: select
        description: Pick from the Mapped areas list if the course is in one of the areas the club has mapped.
        options:
          values:
          # BEGIN areas
          - "Alton Water"
          - "Barnham Cross Common"
          - "Beccles Common"
          - "Belstead Brook"
          - "Bourne Park"
          - "Bramford"
          - "Brandon Country Park"
          - "Broom Hill and The Dales"
          - "Bury St Edmunds"
          - "Chantry Park"
          - "Christchurch Park"
          - "Clare"
          - "Claydon"
          - "Combs Ford"
          - "Culford School"
          - "Elmswell"
          - "Eye"
          - "Finborough"
          - "Foxhall Woods"
          - "Gunton Denes and Dip Farm"
          - "Hadleigh"
          - "Hardwick Heath"
          - "Haughley Park"
          - "Haverhill"
          - "Holywells and Landseer Parks"
          - "Ickworth Park"
          - "Ipswich High School"
          - "Kesgrave"
          - "King's Forest"
          - "Knettishall Heath"
          - "Martlesham Heath"
          - "Moreton Hall"
          - "Needham Market"
          - "Nowton Park"
          - "Orwell Country Park"
          - "RAF Honington"
          - "Rendlesham Forest"
          - "Royal Hospital School"
          - "Shrubland Park"
          - "Sudbury"
          - "Sutton Common"
          - "Tunstall Forest"
          - "West Harling Heath"
          # END areas
      - name: description
        label: ABOUT THE COURSE
        type: rich-text
        options:
          format: html
        description: A short description of what the course is like and who it suits.
      - name: courses
        label: COURSES
        type: object
        list: true
        description: One entry per course, e.g. Orange, 3.0 km, 14 controls.
        fields:
        - name: name
          label: Course name
          type: string
          description: e.g. Orange, Short Green, Course 1
        - name: colour
          label: Colour dot (optional)
          type: select
          description: Only needed if the name isn't already a colour.
          options:
            values:
            - White
            - Yellow
            - Orange
            - Light Green
            - Short Green
            - Green
            - Blue
            - Brown
            - Black
        - name: length
          label: Length (km)
          type: string
        - name: controls
          label: Number of controls
          type: string
        - name: climb
          label: Climb (m, optional)
          type: string
        - name: note
          label: Note (optional)
          type: string
      - name: mapUrl
        label: Map download link
        type: string
        description: The web address of the map PDF (or the page it is on).
      - name: mapNote
        label: Map note (optional)
        type: string
        description: Short line under the download button, e.g. Print at A4. Last updated March 2025.
      - name: gridRef
        label: Start grid reference (OS)
        type: string
        description: e.g. TM 39950 52750. The map pin is placed from this.
      - name: lat
        label: Latitude (optional)
        type: number
        description: Only needed if there is no grid reference.
      - name: lon
        label: Longitude (optional)
        type: number
        description: Only needed if there is no grid reference.
      - name: postcode
        label: Postcode (optional)
        type: string
      - name: w3w
        label: what3words (optional)
        type: string
        description: e.g. only.pint.form
      - name: notes
        label: GETTING THERE AND NOTES
        type: rich-text
        options:
          format: html
        description: Parking, access, dogs, anything people should know.
    - name: maprun
      label: MapRun
      type: file
      path: data/maprun.json
      format: json
      fields:
      - name: maprun
        label: MAPRUN PAGE
        type: object
        fields:
        - name: sub
          label: Subtitle
          type: string
        - name: text
          label: Text
          type: rich-text
          options:
            format: html
        - name: image
          label: Picture (optional)
          type: image
          options:
            path: images/pages
      - name: maprunnew
        label: NEW TO MAPRUN PAGE
        type: object
        fields:
        - name: sub
          label: Subtitle
          type: string
        - name: text
          label: Text
          type: rich-text
          options:
            format: html
        - name: image
          label: Picture (optional)
          type: image
          options:
            path: images/pages
- name: grp_people
  label: People and Clubs
  type: group
  items:
    - name: members
      label: People
      type: collection
      path: data/members
      format: json
      filename: '{primary}.json'
      view:
        primary: name
        fields: [name, club, roles]
      fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: club
        label: Club (leave empty for SUFFOC)
        type: select
        description: Only choose a club if this person is from another club, for example a controller. Pick from Other clubs. If the club is not listed, add it first using Other clubs in the menu.
        options:
          values:
          # BEGIN clubs
          - "BAOC"
          - "BOF"
          - "CHIG"
          - "HAVOC"
          - "NOR"
          - "RAFO"
          - "SMOC"
          - "SOS"
          - "WAOC"
          # END clubs
      - name: phone
        label: Phone (optional)
        type: string
        description: Only add this if they are happy for it to be public. Shown on their page and in contact boxes.
      - name: roles
        label: Club roles (optional, up to 4)
        type: object
        list:
          max: 4
        description: Anyone with a role is shown on the Committee page, in the order set under Roles.
        fields:
        - name: role
          label: Role
          type: select
          description: Pick from Roles. If the role is not listed, add it under Roles first.
          options:
            values:
            # BEGIN roles
            - "Chair"
            - "Entries Coordinator"
            - "MapRun Coordinator"
            - "Membership Secretary"
            - "Secretary"
            - "Results Secretary"
            - "SI Coordinator"
            - "Treasurer"
            - "Regional Representative"
            - "Captain"
            - "Fixtures Secretary"
            - "Welfare Officer"
            - "Volunteer Coordinator"
            - "Mapping Coordinator"
            - "Webmaster"
            - "Equipment Officer"
            - "Safety Liaison Officer"
            - "Junior Committee Representative"
            - "Coach"
            - "Safeguarding & Development Officer"
            # END roles
        - name: email
          label: Email (only if different from the role's email)
          type: string
          description: Just the first part, e.g. coach_clive. The site adds @suffoc.co.uk. Leave empty to use the role's own email, which is set under Roles.
      - name: photo
        label: Photo (optional)
        type: image
        options:
          path: images/people
        description: Only add this if the person is happy for it to be public.
    - name: roles
      label: Roles
      type: collection
      path: data/roles
      format: json
      filename: '{primary}.json'
      view:
        primary: name
        fields: [name, group, order, email]
        sort: order
      fields:
      - name: name
        label: Role Name
        type: string
        required: true
        description: e.g. Chair, Treasurer, Fixtures Secretary.
      - name: email
        label: Role Email
        type: string
        description: Just the first part, e.g. chair. The site adds @suffoc.co.uk. For any other domain type the whole address. It follows the role to whoever holds it next. Leave empty if each holder has their own.
      - name: group
        label: Shown Under
        type: select
        options:
          values:
          - Committee
          - Coaches
          - Other
        description: The heading on the Committee page. Other roles do not appear on it.
      - name: order
        label: Order
        type: number
        description: Lowest number comes first on the Committee page. Leave gaps, e.g. 10, 20, 30, so a new role can slot in.
      - name: description
        label: What The Role Does (optional)
        type: text
    - name: clubs
      label: Other Clubs
      type: collection
      path: data/clubs
      format: json
      filename: '{primary}.json'
      view:
        primary: name
        fields: [name, fullName]
      fields:
      - name: name
        label: Short name
        type: string
        required: true
        description: The short name used on the site, for example NOR or WAOC.
      - name: fullName
        label: Full name
        type: string
        description: For example Norfolk Orienteering Club.
      - name: website
        label: Website
        type: string
        description: The full web address, starting https://
      - name: notes
        label: About the club (optional)
        type: text
        description: A line or two, for example where they usually run.
