          type: string
        - name: winsplits
          label: Winsplits
          type: string
        - name: routegadget
          label: Routegadget
          type: string
        - name: other
          label: Other result links (optional)
          type: object
          list: true
          description: Only for extra links that don't fit above, e.g. a second Routegadget map.
          fields:
