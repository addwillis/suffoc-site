content:
- name: events
  label: Events and results
  type: file
  path: data/events.json
  format: json
  fields:
  - name: events
    label: Events
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{date} {title}'
    fields:
    - name: id
      label: Short ID (web address)
      type: string
      description: Lowercase, no spaces, e.g. tunstall-2026. Used in the event page link.
      required: true
    - name: title
      label: Event name
      type: string
      required: true
    - name: date
      label: Date
      type: string
      description: Format YYYY-MM-DD, e.g. 2026-11-29
      required: true
    - name: timings
      label: Timings
      type: object
      description: Fill in what you know. The first Starts time and the last Course closes time are shown on the home page and Events page.
      fields:
      - name: registrationFrom
        label: Registration opens
        type: string
        description: e.g. 10:00
      - name: registrationTo
        label: Registration closes
        type: string
        description: e.g. 11:30
      - name: startsFrom
        label: Starts open
        type: string
        description: First start time, e.g. 10:30
      - name: startsTo
        label: Starts close
        type: string
        description: Last start time, e.g. 12:00
      - name: courseClose
        label: Course closes
        type: string
        description: Final course close time, e.g. 14:00
    - name: type
      label: Event type
      type: select
      options:
        values:
        - Regional
        - Local event
        - Street-O
        - Score event
        - Training
        - Other
    - name: area
      label: Area ID
      type: string
      description: Must match an ID in Areas, e.g. tunstall
      required: true
    - name: link
      label: Link to existing event page (optional)
      type: string
    - name: pdf
      label: Preliminary details PDF link (optional)
      type: string
    - name: entryUrl
      label: Enter online link (optional)
      type: string
      description: The full web address of the entry page, e.g. the RaceSignup link. Adds a big Enter online button.
    - name: entryNote
      label: Entry note (optional)
      type: string
      description: Short line shown next to the button, e.g. Entries close Friday 27 November
    - name: detail
      label: Event page details (optional, creates a full event page)
      type: object
      fields:
      - name: about
        label: About the area
        type: text
      - name: address
        label: Address lines
        type: string
        list: true
      - name: postcode
        label: Postcode
        type: string
      - name: gridRef
        label: Grid reference (OS)
        type: string
        description: e.g. TM 39950 52750. Places the pin on this event's map and the Google Maps link.
      - name: w3w
        label: what3words (no ///)
        type: string
        description: e.g. only.pint.form. Shown as text and a link only, it does not move the map pin.
      - name: organiser
        label: Organiser
        type: string
      - name: planner
        label: Planner
        type: string
      - name: controller
        label: Controller
        type: string
      - name: docs
        label: Documents and links
        type: object
        list: true
        fields:
        - name: label
          label: Link text
          type: string
        - name: url
          label: Web address
          type: string
    - name: results
      label: Results (add after the event)
      type: object
      list: true
      fields:
      - name: label
        label: Link text (e.g. Results and split times)
        type: string
      - name: url
        label: Web address
        type: string
- name: areas
  label: Mapped areas
  type: file
  path: data/areas.json
  format: json
  fields:
  - name: areas
    label: Areas
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{name}'
    fields:
    - name: id
      label: Area ID
      type: string
      required: true
    - name: name
      label: Name
      type: string
      required: true
    - name: gridRef
      label: Grid reference (OS)
      type: string
      description: e.g. TM 39950 52750. The map pin is placed from this, so you don't need latitude and longitude.
    - name: lat
      label: Latitude (optional)
      type: number
      description: Only needed if there is no grid reference.
    - name: lon
      label: Longitude (optional)
      type: number
      description: Only needed if there is no grid reference.
    - name: label_dx
      label: Map label shift across
      type: number
    - name: label_dy
      label: Map label shift down
      type: number
    - name: label_anchor
      label: Map label side
      type: select
      options:
        values:
        - start
        - middle
        - end
