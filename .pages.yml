media:
  input: images
  output: /images
content:
- name: events
  label: Events and results
  type: collection
  path: data/events
  format: json
  filename: '{primary}.json'
  view:
    fields: [date, title, level, series, area]
    primary: title
    sort: [date, title]
    search: [title, area]
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Event name
    type: string
    required: true
  - name: date
    label: Date
    type: date
    options:
      format: yyyy-MM-dd
    required: true
  - name: level
    label: Event level
    type: select
    description: National, Regional or Local. To change the list, use Event levels in the menu.
    options:
      values:
      # BEGIN levels
      - "National"
      - "Regional"
      - "Local"
      # END levels
  - name: series
    label: Event series
    type: select
    description: Optional. Pick from the Event series list, e.g. Mid-Week Street-O.
    options:
      values:
      # BEGIN series
      - "Compass Sport Heat"
      - "Mid-Week Street-O"
      - "Simon Peck Summer Series"
      # END series
  - name: area
    label: Area
    type: select
    description: Pick from the Mapped areas list. If the place isn't there yet, add it under Mapped areas first.
    required: true
    options:
      values:
      # BEGIN areas
      - "Brandon Country Park"
      - "Clare"
      - "Claydon"
      - "Elmswell"
      - "Hardwick"
      - "Kings Forest"
      - "Needham Lakes"
      - "Sudbury"
      - "Tunstall Forest"
      # END areas
  - name: about
    label: EVENT OVERVIEW
    type: rich-text
    options:
      format: html
    description: A short summary of the event, e.g. what to expect, the terrain and who it suits.
  - name: location
    label: EVENT LOCATION
    type: object
    description: Filling in anything here creates the full event page.
    fields:
    - name: address
      label: Address lines
      type: string
      list: true
    - name: postcode
      label: Postcode
      type: string
    - name: gridRef
      label: Grid reference (OS)
      type: string
      description: e.g. TM 39950 52750. Places the pin on this event's map and the Google Maps link.
    - name: w3w
      label: what3words (no ///)
      type: string
      description: e.g. only.pint.form. Shown as text and a link only, it does not move the map pin.
  - name: courses
    label: COURSES
    type: object
    list: true
    description: Add one entry per course. Leave empty until the courses are confirmed.
    fields:
    - name: name
      label: Course name
      type: string
      description: e.g. Green, Short Green, Course 1, Short, Medium, Long
    - name: colour
      label: Colour dot (optional)
      type: select
      description: Only needed if the name isn't already a colour, e.g. a coloured Short course.
      options:
        values:
        - White
        - Yellow
        - Orange
        - Light Green
        - Short Green
        - Green
        - Blue
        - Brown
        - Black
    - name: length
      label: Length (km)
      type: string
      description: e.g. 3.2
    - name: controls
      label: Number of controls
      type: string
    - name: climb
      label: Climb (m, optional)
      type: string
    - name: note
      label: Note (optional)
      type: string
      description: e.g. Good for beginners
  - name: fees
    label: ENTRY FEES
    type: object
    description: Leave empty until the fees are confirmed. Prices can be typed as 8 or £8.
    fields:
    - name: entryUrl
      label: Enter online link
      type: string
      description: The full web address of the entry page, e.g. the RaceSignup link. Adds the gold Enter online button.
    - name: entryNote
      label: Entry note (optional)
      type: string
      description: Short line under the Enter online button.
    - name: rows
      label: Prices
      type: object
      list: true
      description: One row per type of entrant, e.g. Senior member, Senior non-member, Junior.
      fields:
      - name: category
        label: Who
        type: string
      - name: early
        label: Standard price
        type: string
      - name: late
        label: Late / on the day price
        type: string
    - name: earlyDeadline
      label: Standard price online entry closes (optional)
      type: string
      description: Type as 2026-11-22, or in words like 22 November. Online entries up to this date get the standard price. Leave empty if not needed.
    - name: lateDeadline
      label: Late online entry closes (optional)
      type: string
      description: Type as 2026-11-22, or in words like 22 November. Late online entries are taken up to this date. Leave empty if not needed.
    - name: chipHire
      label: Chip hire
      type: string
      default: "£1"
    - name: siacHire
      label: SIAC chip hire
      type: string
      default: "£3"
    - name: note
      label: Note (optional)
      type: text
      description: e.g. Cash or card on the day. Group discounts.
  - name: timings
    label: EVENT TIMES
    type: object
    description: Fill in what you know. The first Starts time and the last Course closes time are shown on the home page and Events page.
    fields:
    - name: registrationFrom
      label: Registration opens
      type: string
      description: e.g. 10:00
    - name: registrationTo
      label: Registration closes
      type: string
      description: e.g. 11:30
    - name: startsFrom
      label: Starts open
      type: string
      description: First start time, e.g. 10:30
    - name: startsTo
      label: Starts close
      type: string
      description: Last start time, e.g. 12:00
    - name: courseClose
      label: Course closes
      type: string
      description: Final course close time, e.g. 14:00
  - name: officials
    label: EVENT OFFICIALS
    type: object
    description: Pick from Club members. If someone isn't there yet, add them under Club members first, or use Other officials.
    fields:
      - name: organiser
        label: Organiser
        type: select
        options:
          values:
          # BEGIN members
          - "Adam Willis"
          - "Andrew Elliott"
          - "Clive Wilkinson"
          - "Gareth Radcliffe"
          - "Louise Walker"
          - "Martin Hore"
          - "Mike Bickle"
          - "Paul Beckett"
          - "Phil Halford"
          - "Rod Mansel"
          - "Sally Wilkinson"
          - "Sarah Mansel"
          # END members
      - name: planner
        label: Planner
        type: select
        options:
          values:
          # BEGIN members
          - "Adam Willis"
          - "Andrew Elliott"
          - "Clive Wilkinson"
          - "Gareth Radcliffe"
          - "Louise Walker"
          - "Martin Hore"
          - "Mike Bickle"
          - "Paul Beckett"
          - "Phil Halford"
          - "Rod Mansel"
          - "Sally Wilkinson"
          - "Sarah Mansel"
          # END members
      - name: controller
        label: Controller
        type: select
        options:
          values:
          # BEGIN members
          - "Adam Willis"
          - "Andrew Elliott"
          - "Clive Wilkinson"
          - "Gareth Radcliffe"
          - "Louise Walker"
          - "Martin Hore"
          - "Mike Bickle"
          - "Paul Beckett"
          - "Phil Halford"
          - "Rod Mansel"
          - "Sally Wilkinson"
          - "Sarah Mansel"
          # END members
      - name: riskAssessor
        label: Risk Assessor
        type: select
        options:
          values:
          # BEGIN members
          - "Adam Willis"
          - "Andrew Elliott"
          - "Clive Wilkinson"
          - "Gareth Radcliffe"
          - "Louise Walker"
          - "Martin Hore"
          - "Mike Bickle"
          - "Paul Beckett"
          - "Phil Halford"
          - "Rod Mansel"
          - "Sally Wilkinson"
          - "Sarah Mansel"
          # END members
      - name: others
        label: Other officials (optional)
        type: object
        list: true
        description: For helpers who aren't club members, e.g. a controller from another club.
        fields:
        - name: role
          label: Role
          type: string
        - name: name
          label: Name
          type: string
  - name: documents
    label: DOCUMENTS AND LINKS
    type: object
    fields:
    - name: pdf
      label: Preliminary details PDF link
      type: string
    - name: britishOrienteering
      label: British Orienteering event page link
      type: string
      description: The event's page on britishorienteering.org.uk
    - name: oldPage
      label: Link to existing event page
      type: string
    - name: docs
      label: Other documents and links
      type: object
      list: true
      fields:
      - name: label
        label: Link text
        type: string
      - name: url
        label: Web address
        type: string
  - name: resultLinks
    label: RESULTS (add after the event)
    type: object
    description: Paste the web address for each one you have. Leave the others blank.
    fields:
    - name: results
      label: Results and split times
      type: string
    - name: winsplits
      label: Winsplits
      type: string
    - name: routegadget
      label: Routegadget
      type: string
    - name: other
      label: Other result links (optional)
      type: object
      list: true
      description: Only for extra links that don't fit above, e.g. a second Routegadget map.
      fields:
      - name: label
        label: Link text
        type: string
      - name: url
        label: Web address
        type: string
  - name: comments
    label: EVENT COMMENTS (add after the event)
    type: object
    description: Comments from the people who ran the event. Leave empty if you haven't been sent any. A Comments button appears next to the results once any of these have text.
    fields:
    - name: planner
      label: Planner's comments
      type: rich-text
      options:
        format: html
    - name: organiser
      label: Organiser's comments
      type: rich-text
      options:
        format: html
    - name: controller
      label: Controller's comments
      type: rich-text
      options:
        format: html
- name: levels
  label: Event levels
  type: collection
  path: data/levels
  format: json
  filename: '{primary}.json'
  view:
    primary: name
    fields: [name, order]
  fields:
  - name: name
    label: Name
    type: string
    required: true
  - name: order
    label: Order in the dropdown
    type: number
    description: 1 comes first. National 1, Regional 2, Local 3.
- name: series
  label: Event series
  type: collection
  path: data/series
  format: json
  filename: '{primary}.json'
  view:
    primary: name
    fields: [name]
  fields:
  - name: name
    label: Name
    type: string
    required: true
- name: areas
  label: Mapped areas
  type: collection
  path: data/areas
  format: json
  filename: '{primary}.json'
  view:
    primary: name
    fields: [name]
  fields:
  - name: name
    label: Name
    type: string
    required: true
  - name: gridRef
    label: Grid reference (OS)
    type: string
    description: e.g. TM 39950 52750. The map pin is placed from this, so you don't need latitude and longitude.
  - name: lat
    label: Latitude (optional)
    type: number
    description: Only needed if there is no grid reference.
  - name: lon
    label: Longitude (optional)
    type: number
    description: Only needed if there is no grid reference.
- name: members
  label: Club members
  type: collection
  path: data/members
  format: json
  filename: '{primary}.json'
  view:
    primary: name
    fields: [name, roles]
  fields:
  - name: name
    label: Name
    type: string
    required: true
  - name: roles
    label: Club roles (optional, up to 4)
    type: object
    list:
      max: 4
    description: Anyone with a role is shown on the Committee page. Each role has its own email address.
    fields:
    - name: role
      label: Role
      type: string
      description: e.g. Chair, Treasurer, Fixtures Secretary.
    - name: email
      label: Email for this role
      type: string
      description: e.g. chair@suffoc.co.uk. Only add it if it's happy to be public.
  - name: photo
    label: Photo (optional)
    type: image
    description: Only add this if the person is happy for it to be public.
- name: news
  label: News
  type: file
  path: data/news.json
  format: json
  fields:
  - name: news
    label: News items
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{date} {title}'
    fields:
    - name: title
      label: Headline
      type: string
    - name: date
      label: Date
      type: date
      options:
        format: yyyy-MM-dd
    - name: image
      label: Picture (optional)
      type: image
    - name: imageAlt
      label: Picture description (optional)
      type: string
      description: A few words describing the picture, for people using screen readers.
    - name: text
      label: Main text
      type: rich-text
      description: The full article. The cards on the home and News pages show the first few words, with Read more taking people to the full article.
      options:
        format: html
    - name: link
      label: Link to old news page (optional)
      type: string
      description: Only if the article also exists on the old website.
